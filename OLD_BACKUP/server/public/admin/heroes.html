<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes Management</title>
    <style>
        .data-table { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05); }
        .table { margin: 0; }
        .table thead { background: #f8f9fa; }
        .table th { font-weight: 600; color: #666; font-size: 13px; text-transform: uppercase; padding: 15px 20px; border: none; }
        .table td { padding: 15px 20px; border-color: #f0f0f0; vertical-align: middle; }
        .table tbody tr:hover { background: #f8f9fa; }
        .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 13px; margin: 0 3px; }
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 50px; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Heroes Management</h4>
        </div>

        <div class="data-table">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Owner</th>
                            <th>Level</th>
                            <th>Class</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="heroesTable">
                        <tr><td colspan="6" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Hero Detail Modal -->
    <div class="modal fade" id="heroDetailModal" tabindex="-1" aria-labelledby="heroDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="heroDetailModalLabel">Hero Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="heroDetailContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Loading hero details...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hero Edit Modal -->
    <div class="modal fade" id="heroEditModal" tabindex="-1" aria-labelledby="heroEditModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title" id="heroEditModalLabel">Edit Hero</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="heroEditContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Loading hero data...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveHeroBtn" onclick="saveHero()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Skill Manager Modal -->
    <div class="modal fade" id="skillManagerModal" tabindex="-1" aria-labelledby="skillManagerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="skillManagerModalLabel">Manage Hero Skills</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="skillManagerContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-info" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Loading skills...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('=== Heroes Management ===');
        
        const api = {
            baseUrl: '/api/admin',
            token: 'textical-admin-2024',
            
            async request(endpoint, options = {}) {
                const url = `${this.baseUrl}${endpoint}`;
                const headers = {
                    'Content-Type': 'application/json',
                    'x-admin-token': this.token
                };

                console.log(`[API REQUEST] ${options.method || 'GET'} ${url}`);
                console.log(`[API REQUEST] Headers:`, headers);
                if (options.body) {
                    console.log(`[API REQUEST] Body:`, options.body);
                }

                try {
                    const response = await fetch(url, {
                        ...options,
                        headers: { ...headers, ...options.headers }
                    });

                    console.log(`[API RESPONSE] Status: ${response.status} ${response.statusText}`);
                    
                    const data = await response.json();
                    console.log(`[API RESPONSE] Raw:`, data);

                    if (!data.success) {
                        throw new Error(data.error || 'Request failed');
                    }

                    console.log(`[API SUCCESS] Endpoint: ${endpoint}`);
                    return data.data;
                } catch (error) {
                    console.error(`[API ERROR] ${endpoint}:`, error);
                    throw error;
                }
            },

            getHeroes(page = 1, search = '') {
                const url = `/heroes?page=${page}&limit=50&search=${encodeURIComponent(search)}`;
                console.log(`[API CALL] getHeroes -> ${url}`);
                return this.request(url);
            },
            
            getHeroById(id) {
                const url = `/heroes/${id}`;
                console.log(`[API CALL] getHeroById -> ${url}`);
                return this.request(url);
            },
            
            updateHero(id, data) {
                const url = `/heroes/${id}`;
                console.log(`[API CALL] updateHero -> ${url}`, data);
                return this.request(url, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
            },
            
            getSkills() {
                const url = `/skills`;
                console.log(`[API CALL] getSkills -> ${url}`);
                return this.request(url);
            },
            
            addHeroSkill(heroId, skillId) {
                const url = `/heroes/${heroId}/skills`;
                console.log(`[API CALL] addHeroSkill -> ${url}`, { skillId });
                return this.request(url, {
                    method: 'POST',
                    body: JSON.stringify({ skillId })
                });
            },
            
            removeHeroSkill(heroId, skillId) {
                const url = `/heroes/${heroId}/skills/${skillId}`;
                console.log(`[API CALL] removeHeroSkill -> ${url}`);
                return this.request(url, {
                    method: 'DELETE'
                });
            }
        };

        async function loadHeroes() {
            console.log('[Heroes] loadHeroes() called - starting...');
            try {
                console.log('[Heroes] Loading heroes...');
                
                const response = await api.getHeroes(1, '');
                console.log('[Heroes] API Response received:', response);
                
                const tbody = document.getElementById('heroesTable');
                console.log('[Heroes] Table body element:', tbody);
                
                // Fix: API returns data inside .data property
                const heroesData = response.data || response;
                const heroes = heroesData.heroes || heroesData;
                
                console.log('[Heroes] Heroes array:', heroes);
                
                if (!heroes || heroes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No heroes found</td></tr>';
                } else {
                    tbody.innerHTML = heroes.map(hero => `
                        <tr>
                            <td>${hero.id}</td>
                            <td><strong>${hero.name}</strong></td>
                            <td>${hero.user ? hero.user.username : '<em>Unowned</em>'}</td>
                            <td>${hero.unitLevel}</td>
                            <td>${hero.combatClass ? hero.combatClass.name : 'None'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary btn-action" onclick="viewHero(${hero.id})"><i class="bi bi-eye"></i></button>
                                <button class="btn btn-sm btn-outline-warning btn-action" onclick="editHero(${hero.id})"><i class="bi bi-pencil"></i></button>
                            </td>
                        </tr>
                    `).join('');
                    console.log('[Heroes] Rendered', heroes.length, 'heroes');
                }
                
            } catch (error) {
                console.error('[Heroes] Error:', error);
                const tbody = document.getElementById('heroesTable');
                if (tbody) {
                    tbody.innerHTML = `
                        <tr><td colspan="6" class="text-center text-danger py-4">
                            <strong>Error:</strong><br>${error.message}
                        </td></tr>
                    `;
                }
            }
        }

        async function viewHero(id) {
            console.log('[ViewHero] Opening hero:', id);
            
            // Show modal with loading state
            const modal = new bootstrap.Modal(document.getElementById('heroDetailModal'));
            const contentDiv = document.getElementById('heroDetailContent');
            const titleEl = document.getElementById('heroDetailModalLabel');
            
            titleEl.textContent = 'Loading Hero #' + id + '...';
            contentDiv.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Fetching hero details...</p>
                </div>
            `;
            
            modal.show();
            
            try {
                const hero = await api.getHeroById(id);
                console.log('[ViewHero] Hero data:', hero);
                
                titleEl.textContent = 'Hero: ' + hero.name + ' (Lv.' + hero.unitLevel + ')';
                
                // Build comprehensive hero details
                const heroDetails = `
                    <div class="row">
                        <!-- Basic Info -->
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-person-badge"></i> Basic Information</h6>
                                </div>
                                <div class="card-body">
                                    <table class="table table-sm table-borderless">
                                        <tr><td><strong>ID:</strong></td><td>${hero.id}</td></tr>
                                        <tr><td><strong>Name:</strong></td><td>${hero.name}</td></tr>
                                        <tr><td><strong>Race:</strong></td><td>${hero.race || 'HUMAN'}</td></tr>
                                        <tr><td><strong>Unit Level:</strong></td><td>${hero.unitLevel}</td></tr>
                                        <tr><td><strong>Unit XP:</strong></td><td>${hero.unitXp || 0}</td></tr>
                                        <tr><td><strong>Class Level:</strong></td><td>${hero.classLevel || 1}</td></tr>
                                        <tr><td><strong>Class XP:</strong></td><td>${hero.classXp || 0}</td></tr>
                                        <tr><td><strong>Vitality:</strong></td><td>${hero.vitality || 100}</td></tr>
                                        <tr><td><strong>Is Main:</strong></td><td>${hero.isMain ? 'Yes' : 'No'}</td></tr>
                                        <tr><td><strong>Generation:</strong></td><td>${hero.generation || 1}</td></tr>
                                    </table>
                                </div>
                            </div>
                            
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-person"></i> Owner</h6>
                                </div>
                                <div class="card-body">
                                    ${hero.user ? 
                                        `<strong>User:</strong> ${hero.user.username} (ID: ${hero.user.id})` : 
                                        '<em class="text-muted">Unowned / Wild</em>'
                                    }
                                </div>
                            </div>
                            
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-shield"></i> Combat Class</h6>
                                </div>
                                <div class="card-body">
                                    ${hero.combatClass ? 
                                        `<strong>${hero.combatClass.name}</strong><br>
                                        <small class="text-muted">ID: ${hero.combatClass.id}</small>` : 
                                        '<em>None</em>'
                                    }
                                </div>
                            </div>
                        </div>
                        
                        <!-- Stats -->
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-graph-up"></i> Base Stats</h6>
                                </div>
                                <div class="card-body">
                                    <table class="table table-sm table-borderless">
                                        <tr><td><strong>STR:</strong></td><td>${hero.str || 10}</td></tr>
                                        <tr><td><strong>DEX:</strong></td><td>${hero.dex || 10}</td></tr>
                                        <tr><td><strong>INT:</strong></td><td>${hero.int || 10}</td></tr>
                                        <tr><td><strong>VIT:</strong></td><td>${hero.vit || 10}</td></tr>
                                        <tr><td><strong>LUK:</strong></td><td>${hero.luk || 5}</td></tr>
                                    </table>
                                </div>
                            </div>
                            
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-heart"></i> Combat Stats</h6>
                                </div>
                                <div class="card-body">
                                    <table class="table table-sm table-borderless">
                                        <tr><td><strong>HP Base:</strong></td><td>${hero.hp_base || 100}</td></tr>
                                        <tr><td><strong>Damage Base:</strong></td><td>${hero.damage_base || 10}</td></tr>
                                        <tr><td><strong>Defense Base:</strong></td><td>${hero.defense_base || 0}</td></tr>
                                        <tr><td><strong>Speed Base:</strong></td><td>${hero.speed_base || 5}</td></tr>
                                        <tr><td><strong>Range Base:</strong></td><td>${hero.range_base || 1}</td></tr>
                                        <tr><td><strong>Crit Chance:</strong></td><td>${((hero.crit_chance || 0.05) * 100).toFixed(1)}%</td></tr>
                                        <tr><td><strong>Crit Damage:</strong></td><td>${((hero.crit_damage || 1.5) * 100).toFixed(0)}%</td></tr>
                                        <tr><td><strong>Dodge:</strong></td><td>${((hero.dodge_chance || 0.05) * 100).toFixed(1)}%</td></tr>
                                        <tr><td><strong>Block:</strong></td><td>${((hero.block_chance || 0) * 100).toFixed(1)}%</td></tr>
                                        <tr><td><strong>Parry:</strong></td><td>${((hero.parry_chance || 0) * 100).toFixed(1)}%</td></tr>
                                    </table>
                                </div>
                            </div>
                            
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-lightning"></i> Advanced Stats</h6>
                                </div>
                                <div class="card-body">
                                    <table class="table table-sm table-borderless">
                                        <tr><td><strong>HP Regen:</strong></td><td>${hero.hp_regen || 0}</td></tr>
                                        <tr><td><strong>Mana Regen:</strong></td><td>${hero.mana_regen || 2}</td></tr>
                                        <tr><td><strong>Accuracy:</strong></td><td>${hero.accuracy_base || 100}</td></tr>
                                        <tr><td><strong>Armor Pen.:</strong></td><td>${hero.armor_penetration || 0}</td></tr>
                                        <tr><td><strong>Skill Power:</strong></td><td>${hero.skill_power_base || 10}</td></tr>
                                        <tr><td><strong>Tenacity:</strong></td><td>${((hero.tenacity_base || 0) * 100).toFixed(1)}%</td></tr>
                                        <tr><td><strong>Lifesteal:</strong></td><td>${((hero.lifesteal_base || 0) * 100).toFixed(1)}%</td></tr>
                                        <tr><td><strong>Move Speed:</strong></td><td>${hero.move_speed || 100}</td></tr>
                                        <tr><td><strong>Attack Speed:</strong></td><td>${hero.attack_speed || 1.0}</td></tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Elemental Damage -->
                    <div class="row mt-2">
                        <div class="col-12">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-fire"></i> Elemental Damage</h6>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col"><span class="badge bg-danger">Fire:</span> ${hero.fire_damage || 0}</div>
                                        <div class="col"><span class="badge bg-info">Water:</span> ${hero.water_damage || 0}</div>
                                        <div class="col"><span class="badge bg-success">Earth:</span> ${hero.earth_damage || 0}</div>
                                        <div class="col"><span class="badge bg-secondary">Wind:</span> ${hero.wind_damage || 0}</div>
                                        <div class="col"><span class="badge bg-warning text-dark">Light:</span> ${hero.light_damage || 0}</div>
                                        <div class="col"><span class="badge bg-dark">Dark:</span> ${hero.dark_damage || 0}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Equipment -->
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-backpack"></i> Equipment (${hero.equipment ? hero.equipment.length : 0})</h6>
                                </div>
                                <div class="card-body" style="max-height: 200px; overflow-y: auto;">
                                    ${hero.equipment && hero.equipment.length > 0 ? 
                                        `<ul class="list-group list-group-flush">
                                            ${hero.equipment.map(eq => `
                                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                                    <span>${eq.slot || 'Unknown'}</span>
                                                    <span class="badge bg-primary">${eq.id}</span>
                                                </li>
                                            `).join('')}
                                        </ul>` : 
                                        '<p class="text-muted mb-0">No equipment</p>'
                                    }
                                </div>
                            </div>
                        </div>
                        
                        <!-- Skills -->
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0"><i class="bi bi-magic"></i> Skills (${hero.skills ? hero.skills.length : 0})</h6>
                                    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#skillManagerModal" onclick="event.stopPropagation(); openSkillManager(${hero.id})">
                                        <i class="bi bi-plus-circle"></i> Manage
                                    </button>
                                </div>
                                <div class="card-body" style="max-height: 200px; overflow-y: auto;">
                                    ${hero.skills && hero.skills.length > 0 ? 
                                        `<ul class="list-group list-group-flush">
                                            ${hero.skills.map(skill => `
                                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                                    <span>Skill #${skill.skillId || skill.id}</span>
                                                    <div>
                                                        <span class="badge bg-info me-2">Lv.${skill.level || 1}</span>
                                                        <button class="btn btn-sm btn-outline-danger" onclick="removeHeroSkill(${hero.id}, ${skill.skillId || skill.id})">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </div>
                                                </li>
                                            `).join('')}
                                        </ul>` : 
                                        '<p class="text-muted mb-0">No skills - Click "Manage" to add</p>'
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Traits -->
                    <div class="row mt-2">
                        <div class="col-12">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi bi-stars"></i> Traits (${hero.traits ? hero.traits.length : 0})</h6>
                                </div>
                                <div class="card-body" style="max-height: 200px; overflow-y: auto;">
                                    ${hero.traits && hero.traits.length > 0 ? 
                                        `<ul class="list-group list-group-flush">
                                            ${hero.traits.map(trait => `
                                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                                    <span>Trait #${trait.traitId || trait.id}</span>
                                                    <span class="badge bg-warning">${trait.tier || 1}</span>
                                                </li>
                                            `).join('')}
                                        </ul>` : 
                                        '<p class="text-muted mb-0">No traits</p>'
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                contentDiv.innerHTML = heroDetails;
                
            } catch (error) {
                console.error('[ViewHero] Error:', error);
                contentDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error loading hero:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // Global variable to store editing hero ID
        let editingHeroId = null;
        
        async function editHero(id) {
            console.log('[EditHero] Opening edit for hero:', id);
            editingHeroId = id;
            
            const modal = new bootstrap.Modal(document.getElementById('heroEditModal'));
            const contentDiv = document.getElementById('heroEditContent');
            const titleEl = document.getElementById('heroEditModalLabel');
            
            titleEl.textContent = 'Loading Hero #' + id + '...';
            contentDiv.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-warning" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Fetching hero data...</p>
                </div>
            `;
            
            modal.show();
            
            try {
                const hero = await api.getHeroById(id);
                console.log('[EditHero] Hero data:', hero);
                
                titleEl.textContent = 'Edit: ' + hero.name + ' (Lv.' + hero.unitLevel + ')';
                
                // Build edit form
                const editForm = `
                    <form id="heroEditForm">
                        <div class="row">
                            <!-- Basic Info -->
                            <div class="col-md-6">
                                <div class="card mb-3">
                                    <div class="card-header bg-light">
                                        <h6 class="mb-0">Basic Information</h6>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-2">
                                            <label class="form-label">Name</label>
                                            <input type="text" class="form-control" name="name" value="${hero.name || ''}">
                                        </div>
                                        <div class="row">
                                            <div class="col">
                                                <label class="form-label">Unit Level</label>
                                                <input type="number" class="form-control" name="unitLevel" value="${hero.unitLevel || 1}">
                                            </div>
                                            <div class="col">
                                                <label class="form-label">Unit XP</label>
                                                <input type="number" class="form-control" name="unitXp" value="${hero.unitXp || 0}">
                                            </div>
                                        </div>
                                        <div class="row mt-2">
                                            <div class="col">
                                                <label class="form-label">Class Level</label>
                                                <input type="number" class="form-control" name="classLevel" value="${hero.classLevel || 1}">
                                            </div>
                                            <div class="col">
                                                <label class="form-label">Class XP</label>
                                                <input type="number" class="form-control" name="classXp" value="${hero.classXp || 0}">
                                            </div>
                                        </div>
                                        <div class="mb-2 mt-2">
                                            <label class="form-label">Vitality</label>
                                            <input type="number" class="form-control" name="vitality" value="${hero.vitality || 100}">
                                        </div>
                                        <div class="form-check mt-2">
                                            <input class="form-check-input" type="checkbox" name="isMain" ${hero.isMain ? 'checked' : ''} id="isMainCheck">
                                            <label class="form-check-label" for="isMainCheck">
                                                Is Main Hero
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Stats -->
                            <div class="col-md-6">
                                <div class="card mb-3">
                                    <div class="card-header bg-light">
                                        <h6 class="mb-0">Base Stats</h6>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col">
                                                <label class="form-label">STR</label>
                                                <input type="number" class="form-control" name="str" value="${hero.str || 10}">
                                            </div>
                                            <div class="col">
                                                <label class="form-label">DEX</label>
                                                <input type="number" class="form-control" name="dex" value="${hero.dex || 10}">
                                            </div>
                                        </div>
                                        <div class="row mt-2">
                                            <div class="col">
                                                <label class="form-label">INT</label>
                                                <input type="number" class="form-control" name="int" value="${hero.int || 10}">
                                            </div>
                                            <div class="col">
                                                <label class="form-label">VIT</label>
                                                <input type="number" class="form-control" name="vit" value="${hero.vit || 10}">
                                            </div>
                                        </div>
                                        <div class="row mt-2">
                                            <div class="col">
                                                <label class="form-label">LUK</label>
                                                <input type="number" class="form-control" name="luk" value="${hero.luk || 5}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="card mb-3">
                                    <div class="card-header bg-light">
                                        <h6 class="mb-0">Combat Stats</h6>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col">
                                                <label class="form-label">HP Base</label>
                                                <input type="number" class="form-control" name="hp_base" value="${hero.hp_base || 100}">
                                            </div>
                                            <div class="col">
                                                <label class="form-label">Damage Base</label>
                                                <input type="number" class="form-control" name="damage_base" value="${hero.damage_base || 10}">
                                            </div>
                                        </div>
                                        <div class="row mt-2">
                                            <div class="col">
                                                <label class="form-label">Defense Base</label>
                                                <input type="number" class="form-control" name="defense_base" value="${hero.defense_base || 0}">
                                            </div>
                                            <div class="col">
                                                <label class="form-label">Speed Base</label>
                                                <input type="number" class="form-control" name="speed_base" value="${hero.speed_base || 5}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                `;
                
                contentDiv.innerHTML = editForm;
                
            } catch (error) {
                console.error('[EditHero] Error:', error);
                contentDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error loading hero:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        async function saveHero() {
            if (!editingHeroId) return;
            
            console.log('[SaveHero] Saving hero:', editingHeroId);
            
            const saveBtn = document.getElementById('saveHeroBtn');
            const originalText = saveBtn.textContent;
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;
            
            try {
                const form = document.getElementById('heroEditForm');
                const formData = new FormData(form);
                
                const data = {};
                formData.forEach((value, key) => {
                    // Convert numeric fields
                    if (['unitLevel', 'unitXp', 'classLevel', 'classXp', 'vitality', 'str', 'dex', 'int', 'vit', 'luk', 'hp_base', 'damage_base', 'defense_base', 'speed_base'].includes(key)) {
                        data[key] = parseInt(value) || 0;
                    } else {
                        data[key] = value;
                    }
                });
                
                // Handle checkbox
                data.isMain = document.getElementById('isMainCheck').checked;
                
                console.log('[SaveHero] Data to save:', data);
                
                const result = await api.updateHero(editingHeroId, data);
                console.log('[SaveHero] Result:', result);
                
                // Close modal
                const modalEl = document.getElementById('heroEditModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                
                // Show success and reload
                alert('Hero updated successfully!');
                loadHeroes(); // Refresh table
                
            } catch (error) {
                console.error('[SaveHero] Error:', error);
                alert('Error saving hero: ' + error.message);
            } finally {
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }
        }

        // Skill management functions
        let currentSkillHeroId = null;
        
        async function openSkillManager(heroId) {
            console.log('[SkillManager] Opening for hero:', heroId);
            currentSkillHeroId = heroId;
            
            // Fix: Properly handle modal stacking - hide view modal first
            const viewModalEl = document.getElementById('heroDetailModal');
            const viewModal = bootstrap.Modal.getInstance(viewModalEl);
            if (viewModal) {
                viewModal.hide();
            }
            
            // Clean up any remaining backdrops
            setTimeout(() => {
                document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
                document.body.classList.remove('modal-open');
                
                const modalEl = document.getElementById('skillManagerModal');
                const modal = new bootstrap.Modal(modalEl);
                
                // Clean up backdrop when modal is closed
                modalEl.addEventListener('hidden.bs.modal', function() {
                    document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
                    document.body.classList.remove('modal-open');
                });
                
                modal.show();
                
                loadSkillManagerContent(heroId, contentDiv);
            }, 300);
        }
        
        async function loadSkillManagerContent(heroId, contentDiv) {
            try {
                // Get hero details and all available skills
                const [heroData, allSkills] = await Promise.all([
                    api.getHeroById(heroId),
                    api.getSkills()
                ]);
                
                const heroSkills = heroData.skills || [];
                const heroSkillIds = heroSkills.map(s => s.skillId);
                
                console.log('[SkillManager] Hero skills:', heroSkills);
                console.log('[SkillManager] Available skills:', allSkills);
                
                // Get skill data
                const skills = allSkills.data || allSkills;
                
                // Separate owned and available skills
                const ownedSkills = skills.filter(s => heroSkillIds.includes(s.id));
                const availableSkills = skills.filter(s => !heroSkillIds.includes(s.id));
                
                let content = `
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-success text-white">
                                    <h6 class="mb-0"><i class="bi bi-check-circle"></i> Owned Skills (${ownedSkills.length})</h6>
                                </div>
                                <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                                    ${ownedSkills.length > 0 ? 
                                        `<ul class="list-group list-group-flush">
                                            ${ownedSkills.map(skill => `
                                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                                    <div>
                                                        <strong>${skill.name || 'Skill #' + skill.id}</strong>
                                                        <br><small class="text-muted">ID: ${skill.id}</small>
                                                    </div>
                                                    <button class="btn btn-sm btn-outline-danger" onclick="removeHeroSkill(${heroId}, ${skill.id})">
                                                        <i class="bi bi-trash"></i> Remove
                                                    </button>
                                                </li>
                                            `).join('')}
                                        </ul>` : 
                                        '<p class="text-muted">No skills owned</p>'
                                    }
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-primary text-white">
                                    <h6 class="mb-0"><i class="bi bi-plus-circle"></i> Available Skills (${availableSkills.length})</h6>
                                </div>
                                <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                                    ${availableSkills.length > 0 ? 
                                        `<ul class="list-group list-group-flush">
                                            ${availableSkills.map(skill => `
                                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                                    <div>
                                                        <strong>${skill.name || 'Skill #' + skill.id}</strong>
                                                        <br><small class="text-muted">ID: ${skill.id}</small>
                                                    </div>
                                                    <button class="btn btn-sm btn-outline-success" onclick="addHeroSkill(${heroId}, ${skill.id})">
                                                        <i class="bi bi-plus"></i> Add
                                                    </button>
                                                </li>
                                            `).join('')}
                                        </ul>` : 
                                        '<p class="text-muted">All skills already owned</p>'
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                contentDiv.innerHTML = content;
                
            } catch (error) {
                console.error('[SkillManager] Error:', error);
                contentDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error loading skills:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        async function addHeroSkill(heroId, skillId) {
            console.log('[AddSkill] Adding skill:', skillId, 'to hero:', heroId);
            
            if (!confirm('Add this skill to the hero?')) return;
            
            try {
                const result = await api.addHeroSkill(heroId, skillId);
                console.log('[AddSkill] Result:', result);
                
                alert('Skill added successfully!');
                
                // Refresh the skill manager
                openSkillManager(heroId);
                
            } catch (error) {
                console.error('[AddSkill] Error:', error);
                alert('Error adding skill: ' + error.message);
            }
        }
        
        async function removeHeroSkill(heroId, skillId) {
            console.log('[RemoveSkill] Removing skill:', skillId, 'from hero:', heroId);
            
            if (!confirm('Remove this skill from the hero?')) return;
            
            try {
                const result = await api.removeHeroSkill(heroId, skillId);
                console.log('[RemoveSkill] Result:', result);
                
                alert('Skill removed successfully!');
                
                // Refresh the skill manager if open, otherwise refresh the hero view
                const skillModal = document.getElementById('skillManagerModal');
                if (skillModal.classList.contains('show')) {
                    openSkillManager(heroId);
                } else {
                    viewHero(heroId);
                }
                
            } catch (error) {
                console.error('[RemoveSkill] Error:', error);
                alert('Error removing skill: ' + error.message);
            }
        }

        // Try multiple ways to ensure loadHeroes is called
        console.log('[Heroes] Setting up event listeners...');
        
        // Method 1: window load event
        window.addEventListener('load', () => {
            console.log('[Heroes] Window load event fired');
            loadHeroes();
        });
        
        // Method 2: DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[Heroes] DOMContentLoaded event fired');
            loadHeroes();
        });
        
        // Method 3: Try immediately with delay (for AJAX-loaded pages)
        setTimeout(() => {
            console.log('[Heroes] setTimeout fallback - calling loadHeroes');
            loadHeroes();
        }, 500);
        
        // Method 4: Dispatch custom event listener
        window.addEventListener('componentsLoaded', () => {
            console.log('[Heroes] componentsLoaded event fired');
            loadHeroes();
        });

        window.viewHero = viewHero;
        window.editHero = editHero;
        window.saveHero = saveHero;
        window.openSkillManager = openSkillManager;
        window.addHeroSkill = addHeroSkill;
        window.removeHeroSkill = removeHeroSkill;
        console.log('[Heroes] All event listeners registered');
    </script>
</body>
</html>

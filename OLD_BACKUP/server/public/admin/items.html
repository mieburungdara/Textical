<title>Items Management</title>
<style>.data-table{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 15px rgba(0,0,0,0.05)}.table{margin:0}.table thead{background:#f8f9fa}.table th{font-weight:600;color:#666;font-size:13px;text-transform:uppercase;padding:15px 20px;border:none}.table td{padding:15px 20px;border-color:#f0f0f0;vertical-align:middle}.btn-action{padding:6px 12px;border-radius:6px;font-size:13px;margin:0 3px}.search-box{position:relative}.search-box input{padding-left:45px;border-radius:10px}.search-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666}.loading-spinner{display:flex;justify-content:center;align-items:center;padding:50px}.bg-purple{background-color:#9b59b6!important;color:#fff}</style>
<div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">Items Management</h4></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="search-box"><i class="bi bi-search"></i><input type="text" class="form-control" id="itemSearch" placeholder="Search by item name..." oninput="window.handleItemSearch()"></div></div><div class="col-md-2"><select class="form-select" id="itemCategoryFilter" onchange="window.handleItemFilter()"><option value="">All Categories</option><option value="WEAPON">Weapon</option><option value="ARMOR">Armor</option><option value="MATERIAL">Material</option><option value="CONSUMABLE">Consumable</option><option value="TOOL">Tool</option></select></div></div>
<div class="data-table"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Rarity</th><th>Value</th><th>Stats</th><th>Actions</th></tr></thead><tbody id="itemsTable"><tr><td colspan="7" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center p-3 border-top"><small class="text-muted" id="itemsPaginationInfo">Showing 0 to 0 of 0</small><nav><ul class="pagination mb-0" id="itemsPagination"></ul></nav></div></div>
<div class="modal fade" id="itemModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Item Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="itemModalBody">Loading...</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
<script src="common.js"></script>
<script>let itemsState={data:[],page:1,total:0};window.loadItems=async function(){try{console.log('[Items] Loading items...');const data=await api.getItems(itemsState.page,document.getElementById('itemSearch')?.value||'',document.getElementById('itemCategoryFilter')?.value||'');itemsState.data=data.items;itemsState.total=data.pagination.total;const tbody=document.getElementById('itemsTable');if(data.items.length===0){tbody.innerHTML='<tr><td colspan="7" class="text-center text-muted py-4">No items found</td></tr>'}else{tbody.innerHTML=data.items.map(item=>`<tr><td>${item.id}</td><td><strong>${item.name}</strong></td><td>${item.category}</td><td><span class="badge ${getRarityClass(item.rarity)}">${item.rarity}</span></td><td>${formatCurrency(item.baseValue)}</td><td>${item.stats?.length||0}</td><td><button class="btn btn-sm btn-outline-primary btn-action" onclick="window.viewItem(${item.id})"><i class="bi bi-eye"></i></button></td></tr>`).join('')}updatePagination('items',data.pagination);console.log('[Items] Items loaded successfully')}catch(error){console.error('[Items] Error loading items:',error);document.getElementById('itemsTable').innerHTML=`<tr><td colspan="7" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;showAlert('Failed to load items','danger')}};window.handleItemSearch=function(){clearTimeout(window.itemSearchTimeout);window.itemSearchTimeout=setTimeout(()=>{itemsState.page=1;window.loadItems()},300)};window.handleItemFilter=function(){itemsState.page=1;window.loadItems()};window.viewItem=function(id){try{console.log('[Items] Viewing item:',id);const item=itemsState.data.find(i=>i.id===id);document.getElementById('itemModalBody').innerHTML=`<div class="row"><div class="col-md-6"><h6>Item Information</h6><table class="table table-sm"><tr><td><strong>ID:</strong></td><td>${item.id}</td></tr><tr><td><strong>Name:</strong></td><td>${item.name}</td></tr><tr><td><strong>Category:</strong></td><td>${item.category}</td></tr><tr><td><strong>Rarity:</strong></td><td><span class="badge ${getRarityClass(item.rarity)}">${item.rarity}</span></td></tr><tr><td><strong>Value:</strong></td><td>${formatCurrency(item.baseValue)}</td></tr></table></div><div class="col-md-6"><h6>Stats (${item.stats?.length||0})</h6><ul class="list-group">${item.stats&&item.stats.length>0?item.stats.map(s=>`<li class="list-group-item d-flex justify-content-between"><span>${s.statKey}</span><span>${s.statValue}</span></li>`).join(''):'<li class="list-group-item"><em>No stats</em></li>'}</ul></div></div>`;new bootstrap.Modal(document.getElementById('itemModal')).show()}catch(error){console.error('[Items] Error viewing item:',error);showAlert('Failed to load item details','danger')}};window.changeItemPage=function(page){itemsState.page=page;window.loadItems()};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',window.loadItems)}else{window.loadItems()}</script>

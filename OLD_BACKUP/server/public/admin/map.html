<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Atlas Explorer</title>
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-accent: #6366f1;
        }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .map-container {
            background: #020617;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            height: calc(100vh - 120px);
            border: 1px solid var(--glass-border);
        }
        #map {
            width: 100%;
            height: 100%;
            background: transparent !important;
        }
        
        /* Premium Sidebar */
        .region-sidebar {
            position: absolute;
            top: 20px;
            right: -420px;
            width: 380px;
            height: calc(100% - 40px);
            background: var(--glass-bg);
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            z-index: 1000;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .region-sidebar.active {
            right: 20px;
        }
        .sidebar-header {
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
        }
        .sidebar-body {
            padding: 25px;
            height: calc(100% - 100px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-accent) transparent;
        }
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sidebar-close:hover {
            background: #ef4444;
            color: white;
            transform: rotate(90deg);
        }

        /* Map Tooltip Override */
        .leaflet-tooltip-pane .map-tooltip {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border) !important;
            color: white !important;
            border-radius: 12px !important;
            padding: 12px 18px !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4) !important;
        }

        /* Layer Control Premium */
        .map-overlay-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 600px;
        }
        .layer-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: #94a3b8;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .layer-btn:hover {
            color: white;
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .layer-btn.active {
            background: var(--primary-accent);
            color: white;
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-height: 300px;
            overflow-y: auto;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .legend-item:hover {
            transform: translateX(5px);
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .detail-section {
            background: rgba(30, 41, 59, 0.3);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }
        .detail-section:hover {
            background: rgba(30, 41, 59, 0.4);
            border-color: rgba(255,255,255,0.1);
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-accent);
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.8;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .stat-row span:last-child {
            font-weight: 600;
            color: white;
        }
        .badge-custom {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .round-12 { border-radius: 12px; }
        
        .weather-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
            pointer-events: none;
            transition: all 0.3s;
        }
        .npc-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.2s;
            cursor: pointer;
            font-size: 24px;
        }
        .npc-icon:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1 text-white fw-bold">World Atlas Explorer</h4>
                <p class="text-muted small mb-0">Sistem visualisasi ekosistem wilayah kaisar melintasi 1225 grid Arcanum.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-dark btn-sm border-secondary round-12" onclick="window.resetMap()" title="Reset View"><i class="bi bi-arrows-fullscreen"></i></button>
                <button class="btn btn-primary btn-sm px-3 round-12" onclick="window.loadMap()"><i class="bi bi-arrow-clockwise me-1"></i> Sync World</button>
            </div>
        </div>

        <div class="map-container" id="mapWrapper">
            <div id="map"></div>
            
            <div class="map-overlay-controls" id="layerControls">
                <button class="layer-btn active" data-layer="terrain" onclick="switchLayer('terrain')">Normal</button>
                <button class="layer-btn" data-layer="zones" onclick="switchLayer('zones')">Zones</button>
                <button class="layer-btn" data-layer="factions" onclick="switchLayer('factions')">Political</button>
                <button class="layer-btn" data-layer="guilds" onclick="switchLayer('guilds')">Guilds</button>
                <button class="layer-btn" data-layer="danger" onclick="switchLayer('danger')">Danger</button>
                <button class="layer-btn" data-layer="corruption" onclick="switchLayer('corruption')">Darkness</button>
                <button class="layer-btn" data-layer="tax" onclick="switchLayer('tax')">Tax Rate</button>
                <button class="layer-btn" data-layer="ecology" onclick="switchLayer('ecology')">Eco-Stress</button>
                <div class="vr mx-2 bg-white bg-opacity-10"></div>
                <button class="layer-btn" data-layer="weather" onclick="switchLayer('weather')"><i class="bi bi-cloud-sun me-1"></i> Weather</button>
                <button class="layer-btn" data-layer="density" onclick="switchLayer('density')"><i class="bi bi-people me-1"></i> Density</button>
                <button class="layer-btn" data-layer="npc" onclick="switchLayer('npc')"><i class="bi bi-person-walking me-1"></i> NPCs</button>
                <button class="layer-btn" data-layer="boss" onclick="switchLayer('boss')"><i class="bi bi-skull me-1"></i> Elite Boss</button>
            </div>

            <!-- Premium Sidebar -->
            <div id="regionSidebar" class="region-sidebar">
                <button class="sidebar-close" onclick="window.closeSidebar()">&times;</button>
                <div class="sidebar-header" id="sidebarHeader"></div>
                <div class="sidebar-body" id="sidebarContent"></div>
            </div>

            <div class="legend">
                <div class="fw-bold mb-3 text-white d-flex align-items-center gap-2">
                    <i class="bi bi-map-fill text-primary"></i> <span style="letter-spacing: 1px; font-size: 12px; text-transform: uppercase;">Atlas Legend</span>
                </div>
                <div id="dynamicLegend"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script>
        (function() {
            let map;
            const BASE_LAYERS = ['terrain', 'zones', 'factions', 'guilds', 'danger', 'corruption', 'tax', 'ecology'];
            const OVERLAY_LAYERS = ['weather', 'density', 'npc', 'boss'];

            const regionLayers = {};
            BASE_LAYERS.forEach(ln => regionLayers[ln] = L.layerGroup());
            OVERLAY_LAYERS.forEach(ln => regionLayers[ln] = L.layerGroup());

            let currentLayer = 'terrain'; // The layer whose legend is currently displayed
            let activeBaseLayer = 'terrain';
            let regions = [];
            let socket;
            let lastWeatherUpdate = null;

            const WEATHER_ICONS = {
                'CLEAR': '☀️', 'RAIN': '🌧️', 'STORM': '🌩️', 'SNOW': '❄️', 'FOG': '🌫️', 'SANDSTORM': '🌪️'
            };
            const weatherMarkers = new Map(); // regionId -> marker
            const weatherRects = new Map(); // regionId -> rectangle

            const NPC_ICONS = {
                'WANDERER': L.divIcon({ className: 'npc-icon', html: '🚶', iconSize: [30, 30], iconAnchor: [15, 15] }),
                'MERCHANT': L.divIcon({ className: 'npc-icon', html: '💰', iconSize: [30, 30], iconAnchor: [15, 15] }),
                'QUEST_GIVER': L.divIcon({ className: 'npc-icon', html: '📜', iconSize: [30, 30], iconAnchor: [15, 15] }),
                'BANDIT': L.divIcon({ className: 'npc-icon', html: '🗡️', iconSize: [30, 30], iconAnchor: [15, 15] })
            };

            const BOSS_ICON = L.divIcon({ className: 'npc-icon', html: '👹', iconSize: [40, 40], iconAnchor: [20, 20] });

            const DENSITY_COLORS = ['#3b82f6', '#fbbf24', '#f97316', '#ef4444']; // Cold, Warm, Hot, Very Hot

            const ZONE_COLORS = {
                'GREEN': '#22c55e',
                'YELLOW': '#eab308',
                'RED': '#ef4444',
                'BLUE': '#3b82f6',
                'BLACK': '#1e293b',
                'WATER': '#0ea5e9',
                'CHASM': '#000000',
                'DEFAULT': '#64748b'
            };

            const TERRAIN_COLORS = {
                'FOREST': '#14532d',
                'OCEAN': '#0c4a6e',
                'DESERT': '#78350f',
                'MOUNTAIN': '#475569',
                'SNOW': '#f1f5f9',
                'TOWN': '#1e293b',
                'CITADEL': '#312e81',
                'VILLAGE': '#451a03',
                'SWAMP': '#1a2e05',
                'CHASM': '#000000',
                'BRIDGE': '#4b5563',
                'DEFAULT': '#334155'
            };

            const DANGER_COLORS = ['#22c55e', '#84cc16', '#eab308', '#f97316', '#ef4444'];
            
            // Helper to get color from scale
            function getColorFromScale(value, scale) {
                const idx = Math.min(Math.floor(value * scale.length), scale.length - 1);
                return scale[idx];
            }

            const CORRUPTION_SCALE = ['#1e293b', '#334155', '#475569', '#6d28d9', '#4c1d95', '#2e1065'];
            const TAX_SCALE = ['#10b981', '#34d399', '#fcd34d', '#fbbf24', '#f87171', '#ef4444'];
            const ECO_SCALE = ['#22c55e', '#84cc16', '#bef264', '#fde047', '#fb923c', '#f87171'];

            function initMap() {
                map = L.map('map', {
                    crs: L.CRS.Simple,
                    minZoom: -5,
                    maxZoom: 10,
                    zoomSnap: 0,
                    zoomDelta: 0.5,
                    zoomControl: false,
                    attributionControl: false,
                    preferCanvas: true
                });

                L.control.zoom({ position: 'bottomright' }).addTo(map);
                map.setView([0, 0], 0);


                map.on('click', () => window.closeSidebar());
                
                initSocket();
            }

            function initSocket() {
                socket = io();
                
                socket.on('connect', () => {
                    console.log('[Socket] Connected to server. Authenticating...');
                    socket.emit('admin_bypass_login');
                });

                socket.on('authenticated', (data) => {
                    console.log('[Socket] Authenticated successfully:', data);
                    socket.emit('admin:map:subscribe');
                });
                
                socket.on('error', (err) => {
                    console.error('[Socket] Error:', err);
                });

                socket.on('map:weather_update', (data) => {
                    updateWeatherLayer(data.regions);
                });

                socket.on('map:density_update', (data) => {
                    updateDensityLayer(data.counts);
                });

                socket.on('map:npc_update', (data) => {
                    updateNPCLayer(data.npcs);
                });

                socket.on('map:elite_boss_update', (data) => {
                    updateBossLayer(data.bosses);
                });

                // Periodic visibility check for LOD/Culling - Debounced for performance
                let visibilityTimeout;
                map.on('moveend zoomend', () => {
                    clearTimeout(visibilityTimeout);
                    visibilityTimeout = setTimeout(() => updateOverlayVisibility(), 100);
                });
            }

            function updateOverlayVisibility() {
                if (!map) return;
                const bounds = map.getBounds();
                const zoom = map.getZoom();

                // 1. Cull Weather Icons (LOD + Viewport)
                regionLayers.weather.eachLayer(layer => {
                    if (layer instanceof L.Marker) {
                        const isInView = bounds.contains(layer.getLatLng());
                        const isZoomedIn = zoom >= 3; // LOD level 3
                        
                        if (isInView && isZoomedIn) {
                            if (!map.hasLayer(layer)) layer.addTo(regionLayers.weather);
                            layer.getElement()?.classList.remove('d-none');
                        } else {
                            layer.getElement()?.classList.add('d-none');
                        }
                    }
                });

                // 2. Cull NPCs (Zoom check added)
                regionLayers.npc.eachLayer(layer => {
                    if (layer instanceof L.Marker) {
                        const isInView = bounds.contains(layer.getLatLng());
                        const isZoomedIn = zoom >= 3; // LOD level 3
                        
                        if (isInView && isZoomedIn) {
                            layer.getElement()?.classList.remove('d-none');
                        } else {
                            layer.getElement()?.classList.add('d-none');
                        }
                    }
                });

                // 3. Cull Bosses
                regionLayers.boss.eachLayer(layer => {
                    if (layer instanceof L.Marker) {
                        const isInView = bounds.contains(layer.getLatLng());
                        const isZoomedIn = zoom >= 2; // Bosses show up slightly earlier
                        
                        if (isInView && isZoomedIn) {
                            layer.getElement()?.classList.remove('d-none');
                        } else {
                            layer.getElement()?.classList.add('d-none');
                        }
                    }
                });
            }

            function updateWeatherLayer(updates) {
                lastWeatherUpdate = updates;
                if (!Array.isArray(updates)) return;
                
                // Hide all existing first
                weatherMarkers.forEach(m => m.removeFrom(regionLayers.weather));
                weatherRects.forEach(r => r.removeFrom(regionLayers.weather));

                updates.forEach(update => {
                    const region = regions.find(r => r.id === update.regionId);
                    if (region) {
                        // Reuse or create marker
                        let marker = weatherMarkers.get(region.id);
                        const icon = WEATHER_ICONS[update.weather] || '☀️';
                        const html = `<div style="font-size: 24px;">${icon}</div>`;
                        
                        // Reuse or create rectangle
                        let rect = weatherRects.get(region.id);
                        let weatherColor = 'rgba(255,255,255,0)';
                        if (update.weather === 'RAIN') weatherColor = `rgba(59, 130, 246, ${update.intensity * 0.3})`;
                        else if (update.weather === 'STORM') weatherColor = `rgba(30, 58, 138, ${update.intensity * 0.5})`;
                        else if (update.weather === 'SNOW') weatherColor = `rgba(255, 255, 255, ${update.intensity * 0.4})`;
                        else if (update.weather === 'FOG') weatherColor = `rgba(148, 163, 184, ${update.intensity * 0.3})`;

                        if (!rect) {
                            const bounds = [[region.gridY - 0.45, region.gridX - 0.45], [region.gridY + 0.45, region.gridX + 0.45]];
                            rect = L.rectangle(bounds, { fillOpacity: 1, weight: 0, interactive: false });
                            weatherRects.set(region.id, rect);
                        }
                        rect.setStyle({ fillColor: weatherColor });
                        rect.addTo(regionLayers.weather);

                        if (update.weather === 'CLEAR') {
                            // If clear, ensure no marker is shown
                            if (marker) marker.removeFrom(regionLayers.weather);
                        } else {
                            // If NOT clear, show/update marker
                            if (!marker) {
                                marker = L.marker([region.gridY, region.gridX], {
                                    icon: L.divIcon({
                                        className: 'weather-icon',
                                        html: html,
                                        iconSize: [30, 30],
                                        iconAnchor: [15, 15]
                                    })
                                }).bindTooltip(`${region.name}: ${update.weather}`);
                                weatherMarkers.set(region.id, marker);
                            } else {
                                marker.setIcon(L.divIcon({ className: 'weather-icon', html: html, iconSize: [30, 30], iconAnchor: [15, 15] }));
                            }
                            marker.addTo(regionLayers.weather);
                        }
                    }
                });
                updateOverlayVisibility();
            }

            function updateDensityLayer(counts) {
                regionLayers.density.clearLayers();
                regions.forEach(region => {
                    const count = counts[region.id] || 0;
                    if (count > 0) {
                        const bounds = [[region.gridY - 0.45, region.gridX - 0.45], [region.gridY + 0.45, region.gridX + 0.45]];
                        const colorIdx = Math.min(Math.floor(count / 5), DENSITY_COLORS.length - 1);
                        L.rectangle(bounds, {
                            fillColor: DENSITY_COLORS[colorIdx],
                            fillOpacity: 0.6,
                            weight: 1,
                            color: 'white',
                            dashArray: '3, 3'
                        }).bindTooltip(`${region.name}: ${count} Players`).addTo(regionLayers.density);
                    }
                });
            }

            function updateNPCLayer(npcs) {
                regionLayers.npc.clearLayers();
                npcs.forEach(npc => {
                    const icon = NPC_ICONS[npc.type] || NPC_ICONS.WANDERER;
                    L.marker([npc.y, npc.x], { icon })
                        .bindTooltip(`<strong>${npc.name}</strong><br>${npc.status}<br><small>${npc.lore}</small>`)
                        .on('click', () => showRegionDetails(npc.regionId))
                        .addTo(regionLayers.npc);
                });
                updateOverlayVisibility();
            }

            function updateBossLayer(bosses) {
                regionLayers.boss.clearLayers();
                bosses.forEach(boss => {
                    L.marker([boss.y, boss.x], { icon: BOSS_ICON })
                        .bindTooltip(`<strong class="text-danger">ELITE: ${boss.name}</strong><br>Status: ${boss.status}<br>Power: ${boss.powerLevel}`)
                        .addTo(regionLayers.boss);
                });
            }

            window.loadMap = async function() {
                try {
                    console.log('[Map] Syncing world data...');
                    const data = await api.getMapRegions();
                    regions = data;
                    renderMap();
                    
                    // Re-apply latest real-time data if available
                    if (lastWeatherUpdate) {
                        console.log('[Map] Re-applying cached weather data...');
                        updateWeatherLayer(lastWeatherUpdate);
                    }
                    
                    updateLegend();
                    if (regions.length > 0) centerMap();
                } catch (error) {
                    console.error('[Map] Error:', error);
                }
            };

            function renderMap() {
                // Clear ONLY the current active base layer to rebuild it
                // We no longer build all 8 layers at once (huge performance win)
                regionLayers[activeBaseLayer].clearLayers();
                
                regions.forEach(region => {
                    const bounds = [[region.gridY - 0.45, region.gridX - 0.45], [region.gridY + 0.45, region.gridX + 0.45]];
                    
                    let fillColor = '#334155';
                    let tooltipSuffix = '';

                    // Only compute color for what's currently selected
                    if (activeBaseLayer === 'terrain') {
                        fillColor = TERRAIN_COLORS[region.visualType] || TERRAIN_COLORS.DEFAULT;
                        tooltipSuffix = `<small>${region.visualType}</small>`;
                    } else if (activeBaseLayer === 'zones') {
                        fillColor = ZONE_COLORS[region.zoneType] || ZONE_COLORS.DEFAULT;
                        tooltipSuffix = `<small>${region.zoneType} ZONE</small>`;
                    } else if (activeBaseLayer === 'factions') {
                        fillColor = region.faction?.color || '#64748b';
                        tooltipSuffix = `<small>${region.faction?.name || 'Neutral'}</small>`;
                    } else if (activeBaseLayer === 'guilds') {
                        fillColor = region.guildOwnership?.color || 'rgba(0,0,0,0)';
                        tooltipSuffix = `<small>Owned by: ${region.guildOwnership?.name || 'Wilderness'}</small>`;
                    } else if (activeBaseLayer === 'danger') {
                        const dangerIdx = Math.min(Math.floor(region.zoneLevel / 10), 4);
                        fillColor = DANGER_COLORS[dangerIdx];
                        tooltipSuffix = `<small>Danger Lv.${region.dangerLevel}</small>`;
                    } else if (activeBaseLayer === 'corruption') {
                        fillColor = getColorFromScale(region.corruptionLevel || 0, CORRUPTION_SCALE);
                        tooltipSuffix = `<small>Corruption: ${(region.corruptionLevel * 100).toFixed(0)}%</small>`;
                    } else if (activeBaseLayer === 'tax') {
                        fillColor = getColorFromScale(region.regionalTaxRate || 0, TAX_SCALE);
                        tooltipSuffix = `<small>Tax Rate: ${(region.regionalTaxRate * 100).toFixed(1)}%</small>`;
                    } else if (activeBaseLayer === 'ecology') {
                        fillColor = getColorFromScale(region.ecologicalStress || 0, ECO_SCALE);
                        tooltipSuffix = `<small>Eco Stress: ${(region.ecologicalStress * 100).toFixed(0)}%</small>`;
                    }

                    const rect = L.rectangle(bounds, { 
                        fillColor: fillColor, 
                        fillOpacity: 0.8, 
                        weight: 1, 
                        color: 'rgba(255,255,255,0.1)' 
                    });

                    rect.bindTooltip(`<div class="map-tooltip"><strong>${region.name}</strong><br>${tooltipSuffix}</div>`, { sticky: false, direction: 'top', offset: [0, -5], opacity: 0.9 });
                    rect.on('click', (e) => { L.DomEvent.stopPropagation(e); showRegionDetails(region.id); });
                    rect.on('mouseover', function() { this.setStyle({ fillOpacity: 1, weight: 2, color: 'white' }); });
                    rect.on('mouseout', function() { this.setStyle({ fillOpacity: 0.8, weight: 1, color: 'rgba(255,255,255,0.1)' }); });
                    
                    rect.addTo(regionLayers[activeBaseLayer]);
                });

                regionLayers[activeBaseLayer].addTo(map);
            }

            window.switchLayer = function(layerName) {
                if (OVERLAY_LAYERS.includes(layerName)) {
                    // Toggle Overlay logic
                    if (map.hasLayer(regionLayers[layerName])) {
                        map.removeLayer(regionLayers[layerName]);
                        // If turning off, reset legend context to base if it was showing this overlay
                        if (currentLayer === layerName) currentLayer = activeBaseLayer;
                    } else {
                        regionLayers[layerName].addTo(map);
                        currentLayer = layerName;
                    }
                } else {
                    // Switch Base Layer logic
                    if (activeBaseLayer === layerName) return;
                    map.removeLayer(regionLayers[activeBaseLayer]);
                    activeBaseLayer = layerName;
                    renderMap(); // Lazy build the new layer
                    currentLayer = layerName;
                }
                
                // Update UI button active states
                document.querySelectorAll('.layer-btn').forEach(btn => {
                    const ln = btn.dataset.layer;
                    if (OVERLAY_LAYERS.includes(ln)) {
                        btn.classList.toggle('active', map.hasLayer(regionLayers[ln]));
                    } else {
                        btn.classList.toggle('active', ln === activeBaseLayer);
                    }
                });

                updateLegend();
            };

            function updateLegend() {
                const legend = document.getElementById('dynamicLegend');
                let html = '';
                if (currentLayer === 'terrain') {
                    html = Object.entries(TERRAIN_COLORS).filter(([k]) => k !== 'DEFAULT').map(([key, color]) => `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${key}</span></div>`).join('');
                } else if (currentLayer === 'zones') {
                    html = Object.entries(ZONE_COLORS).filter(([k]) => k !== 'DEFAULT').map(([key, color]) => `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${key} ZONE</span></div>`).join('');
                } else if (currentLayer === 'factions') {
                    const factions = [...new Set(regions.map(r => r.faction?.name || 'Neutral'))];
                    html = factions.map(name => {
                        const color = regions.find(r => (r.faction?.name || 'Neutral') === name)?.faction?.color || '#64748b';
                        return `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${name}</span></div>`;
                    }).join('');
                } else if (currentLayer === 'guilds') {
                    const guilds = [...new Set(regions.filter(r => r.guildOwnership).map(r => r.guildOwnership.name))];
                    html = guilds.map(name => {
                        const color = regions.find(r => r.guildOwnership?.name === name)?.guildOwnership?.color || '#f59e0b';
                        return `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${name}</span></div>`;
                    }).join('');
                    if (guilds.length === 0) html = '<div class="text-muted small">No regions controlled by guilds.</div>';
                } else if (currentLayer === 'danger') {
                    html = DANGER_COLORS.map((color, i) => `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">Level ${i*10}${i === 4 ? '+' : '-' + (i*10+9)}</span></div>`).join('');
                } else if (currentLayer === 'corruption') {
                    html = CORRUPTION_SCALE.map((color, i) => `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${i === 0 ? 'Pure' : i === 5 ? 'Void' : 'Step ' + i}</span></div>`).join('');
                } else if (currentLayer === 'tax') {
                    html = TAX_SCALE.map((color, i) => `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${i === 0 ? 'Low' : i === 5 ? 'Greed' : 'Step ' + i}</span></div>`).join('');
                } else if (currentLayer === 'ecology') {
                    html = ECO_SCALE.map((color, i) => `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${i === 0 ? 'Lush' : i === 5 ? 'Dead' : 'Step ' + i}</span></div>`).join('');
                } else if (currentLayer === 'weather') {
                    html = Object.entries(WEATHER_ICONS).map(([key, icon]) => `<div class="legend-item"><span>${icon}</span><span class="small">${key}</span></div>`).join('');
                } else if (currentLayer === 'density') {
                    html = DENSITY_COLORS.map((color, i) => `<div class="legend-item"><div class="legend-color" style="background: ${color}"></div><span class="small">${i === 0 ? 'Quiet' : i === 3 ? 'Overcrowded' : 'Busy'}</span></div>`).join('');
                } else if (currentLayer === 'npc') {
                    html = `
                        <div class="legend-item"><span style="font-size: 16px;">🚶</span> <span class="small">Wanderer</span></div>
                        <div class="legend-item"><span style="font-size: 16px;">💰</span> <span class="small">Merchant</span></div>
                        <div class="legend-item"><span style="font-size: 16px;">📜</span> <span class="small">Quest Giver</span></div>
                        <div class="legend-item"><span style="font-size: 16px;">🗡️</span> <span class="small">Bandit</span></div>
                    `;
                } else if (currentLayer === 'boss') {
                    html = `<div class="legend-item"><span style="font-size: 16px;">👹</span> <span class="small">Elite Boss</span></div>`;
                }
                legend.innerHTML = html;
            }

            function centerMap() {
                const group = L.featureGroup(regionLayers.zones.getLayers());
                if (group.getLayers().length > 0) {
                    map.fitBounds(group.getBounds(), { padding: [10, 10], maxZoom: 5 });
                }
            }

            window.resetMap = () => centerMap();

            const sidebar = document.getElementById('regionSidebar');
            const sidebarHeader = document.getElementById('sidebarHeader');
            const sidebarContent = document.getElementById('sidebarContent');

            window.closeSidebar = () => sidebar.classList.remove('active');

            async function showRegionDetails(regionId) {
                sidebar.classList.add('active');
                sidebarHeader.innerHTML = `<div class="spinner-grow text-primary spinner-grow-sm"></div><span class="ms-2 small">Scanning...</span>`;
                sidebarContent.innerHTML = '';

                try {
                    const region = await api.getRegionById(regionId);
                    sidebarHeader.innerHTML = `<div class="badge-custom mb-3" style="background: ${ZONE_COLORS[region.zoneType] || '#64748b'}; color: white;">${region.zoneType} ZONE</div><h3 class="fw-bold text-white">${region.name}</h3><div class="text-muted small">Lv. ${region.zoneLevel} • ${region.gridX}, ${region.gridY}</div>`;
                    
                    const monsters = region.monsters?.length > 0 ? region.monsters.map(m => `<div class="d-flex justify-content-between small text-white-50 py-1 border-bottom border-secondary border-opacity-10"><span>${m.monster.name}</span><span class="text-danger">LV.${m.monster.level}</span></div>`).join('') : '<div class="text-muted small">None</div>';
                    const resources = region.resources?.length > 0 ? region.resources.map(r => `<div class="d-flex justify-content-between small text-info py-1 border-bottom border-secondary border-opacity-10"><span>${r.itemTemplate.name}</span><i class="bi bi-gem"></i></div>`).join('') : '<div class="text-muted small">None</div>';

                    sidebarContent.innerHTML = `
                        <p class="text-muted small italic mb-4">"${region.flavorText || 'Wilayah misterius.'}"</p>
                        <div class="detail-section"><div class="section-title">Logistics</div><div class="stat-row"><span>Faction</span><span style="color: ${region.faction?.color || '#94a3b8'}">${region.faction?.name || 'Neutral'}</span></div><div class="stat-row"><span>Tax</span><span>${(region.regionalTaxRate*100).toFixed(1)}%</span></div></div>
                        <div class="detail-section"><div class="section-title">Hostiles</div>${monsters}</div>
                        <div class="detail-section"><div class="section-title">Resources</div>${resources}</div>
                    `;
                } catch (e) {
                    sidebarHeader.innerHTML = '<span class="text-danger">Error</span>';
                }
            }

            initMap();
            loadMap();
        })();
    </script>
</body>
</html>

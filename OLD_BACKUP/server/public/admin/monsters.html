<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Management | Textical Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            background-color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }

        .admin-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar - Master (Categories) */
        .category-sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .category-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            background: #fff;
        }

        .category-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .category-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #64748b;
            border-left: 4px solid transparent;
        }

        .category-item:hover {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .category-item.active {
            background-color: #f1f5f9;
            color: #6366f1;
            border-left-color: #6366f1;
            font-weight: 600;
        }

        .category-count {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        /* Main Content - Detail (List) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f8fafc;
        }

        .content-header {
            padding: 1.5rem;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .monster-grid {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .monster-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .monster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #6366f1;
        }

        .monster-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .monster-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Editor Modal */
        .modal-xl { max-width: 1200px; }
        
        .stat-group {
            background: #f8fafc;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .stat-group-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #475569;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <!-- Category sidebar (Master) -->
    <aside class="category-sidebar">
        <div class="category-header">
            <h5 class="mb-0 fw-bold">Categories</h5>
        </div>
        <div class="category-list" id="categoryList">
            <div class="text-center py-4">
                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            </div>
        </div>
    </aside>

    <!-- Main monster list (Detail) -->
    <main class="main-content">
        <header class="content-header">
            <div class="d-flex align-items-center gap-3">
                <h4 class="mb-0 fw-bold" id="selectedCategoryName">All Monsters</h4>
                <div class="input-group" style="width: 300px;">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0" id="monsterSearch" placeholder="Search monsters..." oninput="window.handleMonsterSearch()">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary d-flex align-items-center gap-2" onclick="window.seedMonsters()">
                    <i class="bi bi-database-add"></i> Seed
                </button>
                <button class="btn btn-primary d-flex align-items-center gap-2" onclick="window.createMonster()">
                    <i class="bi bi-plus-lg"></i> New Monster
                </button>
            </div>
        </header>

        <div class="monster-grid">
            <div class="row g-4" id="monsterList">
                <!-- Monsters will be loaded here -->
            </div>
        </div>
    </main>
</div>

<!-- Monster Editor Modal -->
<div class="modal fade" id="monsterModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold" id="modalTitle">Monster Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="monsterForm" onsubmit="window.saveMonster(event)">
                <div class="modal-body p-4">
                    <input type="hidden" id="monsterId">
                    <div class="row g-4">
                        <!-- Left Column: Basic Info -->
                        <div class="col-md-4">
                            <div class="stat-group">
                                <div class="stat-group-title">Basic Information</div>
                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" id="monsterName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Category</label>
                                    <select class="form-select" id="monsterCategory" required></select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Behavior Tree</label>
                                    <input type="text" class="form-control" id="monsterBT" value="SimpleAI">
                                </div>
                            </div>

                            <div class="stat-group">
                                <div class="stat-group-title">Primary Stats</div>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <label class="form-label">Base HP</label>
                                        <input type="number" class="form-control" id="m_hp_base" required>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Base Damage</label>
                                        <input type="number" class="form-control" id="m_damage_base" required>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Base Defense</label>
                                        <input type="number" class="form-control" id="m_defense_base" value="0">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Base Speed</label>
                                        <input type="number" class="form-control" id="m_speed_base" value="5">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Middle Column: Combat Stats -->
                        <div class="col-md-4">
                            <div class="stat-group">
                                <div class="stat-group-title">Combat Performance</div>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <label class="form-label">Accuracy</label>
                                        <input type="number" class="form-control" id="m_accuracy_base" value="100">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Range</label>
                                        <input type="number" class="form-control" id="m_range_base" value="1">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Dodge Rate (%)</label>
                                        <input type="number" step="0.01" class="form-control" id="m_dodge_rate" value="0.05">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Crit Chance (%)</label>
                                        <input type="number" step="0.01" class="form-control" id="m_crit_chance" value="0.05">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Crit Damage (Multiplier)</label>
                                        <input type="number" step="0.1" class="form-control" id="m_crit_damage" value="1.5">
                                    </div>
                                </div>
                            </div>

                            <div class="stat-group">
                                <div class="stat-group-title">Defense & Utility</div>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <label class="form-label">Block Chance (%)</label>
                                        <input type="number" step="0.01" class="form-control" id="m_block_chance" value="0">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Block Power (%)</label>
                                        <input type="number" step="0.01" class="form-control" id="m_block_power_base" value="0.5">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Initiative</label>
                                        <input type="number" class="form-control" id="m_initiative_base" value="0">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Lifesteal (%)</label>
                                        <input type="number" step="0.01" class="form-control" id="m_lifesteal_base" value="0">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Speed & Regeneration -->
                        <div class="col-md-4">
                            <div class="stat-group">
                                <div class="stat-group-title">Movement & Actions</div>
                                <div class="row g-2">
                                    <div class="col-12">
                                        <label class="form-label">Move Speed</label>
                                        <input type="number" class="form-control" id="m_move_speed" value="100">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Attack Speed (Interval)</label>
                                        <input type="number" step="0.1" class="form-control" id="m_attack_speed" value="1.0">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">CDR (%)</label>
                                        <input type="number" step="0.01" class="form-control" id="m_cooldown_reduction" value="0">
                                    </div>
                                </div>
                            </div>

                            <div class="stat-group">
                                <div class="stat-group-title">Traits</div>
                                <div id="monsterTraitsList" class="mb-2">
                                    <!-- Traits list -->
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-secondary w-100" onclick="window.addTrait()">
                                    <i class="bi bi-plus"></i> Add Trait
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-link link-secondary text-decoration-none" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4 shadow-sm fw-600">Save Monster</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script>
let state = {
    categories: [],
    monsters: [],
    selectedCategoryId: null,
    traits: []
};

// Function declarations first - all with window. prefix

window.loadCategories = async function() {
    try {
        const response = await fetch('/api/admin/monsters/categories');
        if (!response.ok) {
            state.categories = [{ id: 0, name: 'All' }];
        } else {
            state.categories = await response.json();
        }
        window.renderCategories();
        
        // Populate category dropdown in modal
        const select = document.getElementById('monsterCategory');
        if (select) {
            select.innerHTML = state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
    } catch (error) {
        console.error('[Monsters] Failed to load categories:', error);
        state.categories = [{ id: 0, name: 'All' }];
        window.renderCategories();
    }
};

window.loadTraits = async function() {
    try {
        const response = await fetch('/api/admin/traits');
        if (response.ok) state.traits = await response.json();
    } catch (e) { 
        console.warn('[Monsters] Could not load traits list:', e); 
    }
};

window.loadMonsters = async function() {
    const listEl = document.getElementById('monsterList');
    if (listEl) {
        listEl.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
    }
    
    try {
        const search = document.getElementById('monsterSearch')?.value || '';
        const url = `/api/admin/monsters?limit=100&search=${encodeURIComponent(search)}`;
        if (state.selectedCategoryId) {
            // Add category filter if needed
        }
        const response = await fetch(url);
        if (response.ok) {
            // API returns flat array, not object with 'monsters' property
            const data = await response.json();
            state.monsters = Array.isArray(data) ? data : (data.monsters || []);
            console.log('[Monsters] Loaded:', state.monsters.length, 'monsters');
            window.renderMonsters();
        } else {
            throw new Error('Failed to load monsters');
        }
    } catch (error) {
        console.error('[Monsters] Failed to load monsters:', error);
        if (listEl) {
            listEl.innerHTML = '<div class="col-12 text-center text-danger py-4">Failed to load monsters. Check console for details.</div>';
        }
    }
};

window.renderCategories = function() {
    const list = document.getElementById('categoryList');
    if (!list) return;
    
    list.innerHTML = `
        <div class="category-item ${state.selectedCategoryId === null ? 'active' : ''}" onclick="window.selectCategory(null)">
            <span>All Monsters</span>
        </div>
        ${state.categories.map(c => `
            <div class="category-item ${state.selectedCategoryId === c.id ? 'active' : ''}" onclick="window.selectCategory(${c.id})">
                <span>${c.name}</span>
            </div>
        `).join('')}
    `;
};

window.selectCategory = function(id) {
    state.selectedCategoryId = id;
    const cat = state.categories.find(c => c.id === id);
    const nameEl = document.getElementById('selectedCategoryName');
    if (nameEl) {
        nameEl.innerText = cat ? cat.name : 'All Monsters';
    }
    window.renderCategories();
    window.loadMonsters();
};

window.renderMonsters = function() {
    const list = document.getElementById('monsterList');
    if (!list) return;
    
    if (state.monsters.length === 0) {
        list.innerHTML = '<div class="col-12 text-center py-5 text-muted">No monsters found.</div>';
        return;
    }

    list.innerHTML = state.monsters.map(m => `
        <div class="col-md-6 col-lg-4">
            <div class="monster-card" onclick="window.editMonster(${m.id})">
                <div class="monster-icon">
                    <i class="bi bi-bug"></i>
                </div>
                <div class="fw-bold mb-1">${m.name}</div>
                <div class="text-muted small mb-3">${m.category?.name || 'Uncategorized'}</div>
                <div class="monster-stats">
                    <div class="stat-item"><i class="bi bi-heart-fill text-danger"></i> ${m.hp_base} HP</div>
                    <div class="stat-item"><i class="bi bi-lightning-fill text-warning"></i> ${m.damage_base} ATK</div>
                    <div class="stat-item"><i class="bi bi-shield-fill text-primary"></i> ${m.defense_base || 0} DEF</div>
                    <div class="stat-item"><i class="bi bi-speedometer2 text-info"></i> ${m.speed_base || 5} SPD</div>
                </div>
            </div>
        </div>
    `).join('');
};

window.handleMonsterSearch = function() {
    clearTimeout(this.searchTimeout || window.monsterSearchTimeout);
    window.monsterSearchTimeout = setTimeout(() => window.loadMonsters(), 300);
};

window.createMonster = function() {
    const form = document.getElementById('monsterForm');
    const modalTitle = document.getElementById('modalTitle');
    const traitsList = document.getElementById('monsterTraitsList');
    
    if (form) form.reset();
    const idEl = document.getElementById('monsterId');
    if (idEl) idEl.value = '';
    if (modalTitle) modalTitle.innerText = 'New Monster';
    if (traitsList) traitsList.innerHTML = '';
    
    const modalEl = document.getElementById('monsterModal');
    if (modalEl && typeof bootstrap !== 'undefined') {
        new bootstrap.Modal(modalEl).show();
    }
};

window.editMonster = async function(id) {
    const monster = state.monsters.find(m => m.id === id);
    if (!monster) {
        console.error('[Monsters] Monster not found:', id);
        return;
    }

    document.getElementById('monsterId').value = monster.id;
    document.getElementById('monsterName').value = monster.name;
    document.getElementById('monsterCategory').value = monster.categoryId;
    document.getElementById('monsterBT').value = monster.behaviorTree || 'SimpleAI';
    
    // Stats
    document.getElementById('m_hp_base').value = monster.hp_base;
    document.getElementById('m_damage_base').value = monster.damage_base;
    document.getElementById('m_defense_base').value = monster.defense_base || 0;
    document.getElementById('m_speed_base').value = monster.speed_base || 5;
    document.getElementById('m_accuracy_base').value = monster.accuracy_base || 100;
    document.getElementById('m_range_base').value = monster.range_base || 1;
    document.getElementById('m_dodge_rate').value = monster.dodge_rate || 0.05;
    document.getElementById('m_crit_chance').value = monster.crit_chance || 0.05;
    document.getElementById('m_crit_damage').value = monster.crit_damage || 1.5;
    document.getElementById('m_block_chance').value = monster.block_chance || 0;
    document.getElementById('m_block_power_base').value = monster.block_power_base || 0.5;
    document.getElementById('m_initiative_base').value = monster.initiative_base || 0;
    document.getElementById('m_lifesteal_base').value = monster.lifesteal_base || 0;
    document.getElementById('m_move_speed').value = monster.move_speed || 100;
    document.getElementById('m_attack_speed').value = monster.attack_speed || 1.0;
    document.getElementById('m_cooldown_reduction').value = monster.cooldown_reduction || 0;

    window.renderMonsterTraits(monster.traits);
    
    const modalTitle = document.getElementById('modalTitle');
    if (modalTitle) modalTitle.innerText = 'Edit Monster: ' + monster.name;
    
    const modalEl = document.getElementById('monsterModal');
    if (modalEl && typeof bootstrap !== 'undefined') {
        new bootstrap.Modal(modalEl).show();
    }
};

window.renderMonsterTraits = function(traits = []) {
    const list = document.getElementById('monsterTraitsList');
    if (!list) return;
    
    list.innerHTML = traits.length === 0 
        ? '<div class="text-muted small italic">No traits assigned</div>' 
        : traits.map(t => `
            <div class="d-flex justify-content-between align-items-center bg-white border rounded p-2 mb-1">
                <span class="small">${t.trait?.name || t.name || 'Unknown Trait'}</span>
                <button type="button" class="btn btn-sm text-danger p-0" onclick="this.parentElement.remove()"><i class="bi bi-x-circle"></i></button>
            </div>
        `).join('');
};

window.saveMonster = async function(e) {
    e.preventDefault();
    const id = document.getElementById('monsterId').value;
    const body = {
        name: document.getElementById('monsterName').value,
        categoryId: document.getElementById('monsterCategory').value,
        behaviorTree: document.getElementById('monsterBT').value,
        hp_base: document.getElementById('m_hp_base').value,
        damage_base: document.getElementById('m_damage_base').value,
        defense_base: document.getElementById('m_defense_base').value,
        speed_base: document.getElementById('m_speed_base').value,
        accuracy_base: document.getElementById('m_accuracy_base').value,
        range_base: document.getElementById('m_range_base').value,
        dodge_rate: document.getElementById('m_dodge_rate').value,
        crit_chance: document.getElementById('m_crit_chance').value,
        crit_damage: document.getElementById('m_crit_damage').value,
        block_chance: document.getElementById('m_block_chance').value,
        block_power_base: document.getElementById('m_block_power_base').value,
        initiative_base: document.getElementById('m_initiative_base').value,
        lifesteal_base: document.getElementById('m_lifesteal_base').value,
        move_speed: document.getElementById('m_move_speed').value,
        attack_speed: document.getElementById('m_attack_speed').value,
        cooldown_reduction: document.getElementById('m_cooldown_reduction').value
    };

    try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/admin/monsters/${id}` : '/api/admin/monsters';
        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        if (response.ok) {
            showAlert('Monster saved successfully!', 'success');
            const modal = bootstrap.Modal.getInstance(document.getElementById('monsterModal'));
            if (modal) modal.hide();
            window.loadMonsters();
        } else {
            const err = await response.json();
            throw new Error(err.message || 'Save failed');
        }
    } catch (error) {
        console.error('[Monsters] Save failed:', error);
        showAlert(error.message, 'danger');
    }
};

window.addTrait = function() {
    const list = document.getElementById('monsterTraitsList');
    if (!list) return;
    
    // Simple trait selector - in production this would open a modal
    const traitName = prompt('Enter trait name:');
    if (traitName) {
        list.innerHTML += `
            <div class="d-flex justify-content-between align-items-center bg-white border rounded p-2 mb-1">
                <span class="small">${traitName}</span>
                <button type="button" class="btn btn-sm text-danger p-0" onclick="this.parentElement.remove()"><i class="bi bi-x-circle"></i></button>
            </div>
        `;
    }
};

window.seedMonsters = async function() {
    if (!confirm('This will seed/reset monsters from JSON files. Continue?')) return;
    
    try {
        showAlert('Seeding monsters...', 'info');
        const response = await fetch('/api/admin/seed/monsters', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        
        if (response.ok) {
            const result = await response.json();
            console.log('[Monsters] Seed result:', result);
            showAlert(`Seeded successfully! Monsters: ${result.data?.monsters || 0}, Regions: ${result.data?.regions || 0}, Items: ${result.data?.items || 0}`, 'success');
            // Reload monsters
            window.loadMonsters();
        } else {
            const err = await response.json();
            throw new Error(err.error || 'Seed failed');
        }
    } catch (error) {
        console.error('[Monsters] Seed failed:', error);
        showAlert('Seed failed: ' + error.message, 'danger');
    }
};

// Initialize - called by admin panel loader
window.init = async function() {
    try {
        console.log('[Monsters] Initializing...');
        await Promise.all([
            window.loadCategories(),
            window.loadTraits()
        ]);
        await window.loadMonsters();
        console.log('[Monsters] Initialization complete');
    } catch (error) {
        console.error('[Monsters] Init failed:', error);
        showAlert('Failed to initialize monsters panel', 'danger');
    }
};

// Auto-init if DOM is already loaded (for standalone testing)
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', window.init);
} else {
    setTimeout(window.init, 0);
}
</script>

<title>Regions Management</title>
<style>.data-table{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 15px rgba(0,0,0,0.05)}.table{margin:0}.table thead{background:#f8f9fa}.table th{font-weight:600;color:#666;font-size:13px;text-transform:uppercase;padding:15px 20px;border:none}.table td{padding:15px 20px;border-color:#f0f0f0;vertical-align:middle}.btn-action{padding:6px 12px;border-radius:6px;font-size:13px;margin:0 3px}.search-box{position:relative}.search-box input{padding-left:45px;border-radius:10px}.search-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666}.loading-spinner{display:flex;justify-content:center;align-items:center;padding:50px}</style>
<div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">Regions Management</h4></div>
<div class="row g-3 mb-4"><div class="col-md-6"><div class="search-box"><i class="bi bi-search"></i><input type="text" class="form-control" id="regionSearch" placeholder="Search by region name..." oninput="window.handleRegionSearch()"></div></div></div>
<div class="data-table"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Visual Type</th><th>Zone</th><th>Faction</th><th>Resources</th><th>Actions</th></tr></thead><tbody id="regionsTable"><tr><td colspan="7" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center p-3 border-top"><small class="text-muted" id="regionsPaginationInfo">Showing 0 to 0 of 0</small><nav><ul class="pagination mb-0" id="regionsPagination"></ul></nav></div></div>
<div class="modal fade" id="regionModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Region Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="regionModalBody">Loading...</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
<script src="common.js"></script>
<script>let regionsState={data:[],page:1,total:0};window.loadRegions=async function(){try{console.log('[Regions] Loading regions...');const data=await api.getRegions(regionsState.page,document.getElementById('regionSearch')?.value||'');regionsState.data=data.regions;regionsState.total=data.pagination.total;const tbody=document.getElementById('regionsTable');if(data.regions.length===0){tbody.innerHTML='<tr><td colspan="7" class="text-center text-muted py-4">No regions found</td></tr>'}else{tbody.innerHTML=data.regions.map(r=>`<tr><td>${r.id}</td><td><strong>${r.name}</strong></td><td>${r.visualType}</td><td>Zone ${r.zoneLevel} (${r.zoneType})</td><td>${r.faction?r.faction.name:'None'}</td><td>${r.resources?.length||0}</td><td><button class="btn btn-sm btn-outline-primary btn-action" onclick="window.viewRegion(${r.id})"><i class="bi bi-eye"></i></button></td></tr>`).join('')}updatePagination('regions',data.pagination);console.log('[Regions] Regions loaded successfully')}catch(error){console.error('[Regions] Error loading regions:',error);document.getElementById('regionsTable').innerHTML=`<tr><td colspan="7" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;showAlert('Failed to load regions','danger')}};window.handleRegionSearch=function(){clearTimeout(window.regionSearchTimeout);window.regionSearchTimeout=setTimeout(()=>{regionsState.page=1;window.loadRegions()},300)};window.viewRegion=function(id){try{console.log('[Regions] Viewing region:',id);const region=regionsState.data.find(r=>r.id===id);document.getElementById('regionModalBody').innerHTML=`<div class="row"><div class="col-md-6"><h6>Region Information</h6><table class="table table-sm"><tr><td><strong>ID:</strong></td><td>${region.id}</td></tr><tr><td><strong>Name:</strong></td><td>${region.name}</td></tr><tr><td><strong>Visual Type:</strong></td><td>${region.visualType}</td></tr><tr><td><strong>Zone Type:</strong></td><td>${region.zoneType}</td></tr><tr><td><strong>Zone Level:</strong></td><td>${region.zoneLevel}</td></tr><tr><td><strong>Regional Tax:</strong></td><td>${(region.regionalTaxRate*100).toFixed(0)}%</td></tr></table></div><div class="col-md-6"><h6>Resources (${region.resources?.length||0})</h6><ul class="list-group">${region.resources&&region.resources.length>0?region.resources.map(r=>`<li class="list-group-item">Item ${r.itemId} - ${r.gatherTimeSeconds}s</li>`).join(''):'<li class="list-group-item"><em>No resources</em></li>'}</ul></div></div>`;new bootstrap.Modal(document.getElementById('regionModal')).show()}catch(error){console.error('[Regions] Error viewing region:',error);showAlert('Failed to load region details','danger')}};window.changeRegionPage=function(page){regionsState.page=page;window.loadRegions()};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',window.loadRegions)}else{window.loadRegions()}</script>

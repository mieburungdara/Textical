<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }
        .container {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Heroes API Test</h1>
        <p>This simple page directly calls the heroes API endpoint and displays the raw response.</p>
        
        <button onclick="testHeroesAPI()">Test Heroes API</button>
        
        <div id="result" class="result">
            Click the button above to test the API.
        </div>
    </div>

    <script>
        async function testHeroesAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Loading...';
            resultDiv.className = 'result';

            try {
                const response = await fetch('/api/admin/heroes', {
                    headers: {
                        'x-admin-token': 'textical-admin-2024'
                    }
                });

                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.className = 'result success';

                // Log details about the response
                console.log('API Response:', data);
                if (data.data) {
                    console.log('Heroes found:', data.data.heroes.length);
                    console.log('Total:', data.data.pagination.total);
                }

            } catch (error) {
                resultDiv.textContent = 'Error: ' + error.message;
                resultDiv.className = 'result error';
                console.error('API Error:', error);
            }
        }
    </script>
</body>
</html>

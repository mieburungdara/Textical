<!-- Footer Component -->
<style>
    .admin-footer {
        background: #fff;
        padding: 16px 24px;
        border-top: 1px solid #e5e7eb;
        margin-top: 32px;
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .footer-info {
        display: flex;
        align-items: center;
        gap: 16px;
    }
    
    .footer-version {
        font-size: 0.875rem;
        color: #64748b;
    }
    
    .footer-version strong {
        color: #1e293b;
    }
    
    .footer-links {
        display: flex;
        gap: 16px;
    }
    
    .footer-link {
        font-size: 0.875rem;
        color: #64748b;
        text-decoration: none;
        transition: color 0.2s;
    }
    
    .footer-link:hover {
        color: #4f46e5;
    }
    
    .footer-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
    }
    
    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
</style>

<footer class="admin-footer" id="adminFooter">
    <div class="footer-info">
        <div class="footer-version">
            <strong>Textical</strong> Admin Panel v1.0
        </div>
        <div class="footer-links">
            <a href="#" class="footer-link" onclick="showAlert('Documentation coming soon!', 'info'); return false;">Docs</a>
            <a href="#" class="footer-link" onclick="showAlert('Support coming soon!', 'info'); return false;">Support</a>
            <a href="#" class="footer-link" onclick="showAlert('About Textical RPG v1.0', 'info'); return false;">About</a>
        </div>
    </div>
    <div class="footer-status">
        <div class="status-dot"></div>
        <span>Server Online</span>
    </div>
</footer>

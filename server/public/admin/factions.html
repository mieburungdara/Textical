<title>Factions Management</title>
<style>.data-table{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 15px rgba(0,0,0,0.05)}.table{margin:0}.table thead{background:#f8f9fa}.table th{font-weight:600;color:#666;font-size:13px;text-transform:uppercase;padding:15px 20px;border:none}.table td{padding:15px 20px;border-color:#f0f0f0;vertical-align:middle}.btn-action{padding:6px 12px;border-radius:6px;font-size:13px;margin:0 3px}.search-box{position:relative}.search-box input{padding-left:45px;border-radius:10px}.search-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666}.loading-spinner{display:flex;justify-content:center;align-items:center;padding:50px}.faction-color{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px}</style>
<div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">Factions Management</h4></div>
<div class="row g-3 mb-4"><div class="col-md-6"><div class="search-box"><i class="bi bi-search"></i><input type="text" class="form-control" id="factionSearch" placeholder="Search by faction name..." oninput="window.handleFactionSearch()"></div></div></div>
<div class="data-table"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Color</th><th>Description</th><th>Actions</th></tr></thead><tbody id="factionsTable"><tr><td colspan="5" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center p-3 border-top"><small class="text-muted" id="factionsPaginationInfo">Showing 0 to 0 of 0</small><nav><ul class="pagination mb-0" id="factionsPagination"></ul></nav></div></div>
<div class="modal fade" id="factionModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Faction Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="factionModalBody">Loading...</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
<script src="common.js"></script>
<script>let factionsState={data:[],page:1,total:0};window.loadFactions=async function(){try{console.log('[Factions] Loading factions...');const data=await api.getFactions(factionsState.page,document.getElementById('factionSearch')?.value||'');factionsState.data=data.factions;factionsState.total=data.pagination.total;const tbody=document.getElementById('factionsTable');if(data.factions.length===0){tbody.innerHTML='<tr><td colspan="5" class="text-center text-muted py-4">No factions found</td></tr>'}else{tbody.innerHTML=data.factions.map(f=>`<tr><td>${f.id}</td><td><span class="faction-color" style="background:${f.color||'#ccc'}"></span><strong>${f.name}</strong></td><td><span class="badge" style="background:${f.color||'#ccc'}">${f.color||'N/A'}</span></td><td>${truncateText(f.description,60)}</td><td><button class="btn btn-sm btn-outline-primary btn-action" onclick="window.viewFaction(${f.id})"><i class="bi bi-eye"></i></button></td></tr>`).join('')}updatePagination('factions',data.pagination);console.log('[Factions] Factions loaded successfully')}catch(error){console.error('[Factions] Error loading factions:',error);document.getElementById('factionsTable').innerHTML=`<tr><td colspan="5" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;showAlert('Failed to load factions','danger')}};window.handleFactionSearch=function(){clearTimeout(window.factionSearchTimeout);window.factionSearchTimeout=setTimeout(()=>{factionsState.page=1;window.loadFactions()},300)};window.viewFaction=function(id){try{console.log('[Factions] Viewing faction:',id);const faction=factionsState.data.find(f=>f.id===id);document.getElementById('factionModalBody').innerHTML=`<h6>Faction Information</h6><table class="table table-sm"><tr><td><strong>ID:</strong></td><td>${faction.id}</td></tr><tr><td><strong>Name:</strong></td><td><span class="faction-color" style="background:${faction.color||'#ccc'}"></span>${faction.name}</td></tr><tr><td><strong>Color:</strong></td><td><span class="badge" style="background:${faction.color||'#ccc'}">${faction.color||'N/A'}</span></td></tr><tr><td><strong>Description:</strong></td><td>${faction.description||'None'}</td></tr></table>`;new bootstrap.Modal(document.getElementById('factionModal')).show()}catch(error){console.error('[Factions] Error viewing faction:',error);showAlert('Failed to load faction details','danger')}};window.changeFactionPage=function(page){factionsState.page=page;window.loadFactions()};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',window.loadFactions)}else{window.loadFactions()}</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes Management</title>
    <style>
        .data-table { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05); }
        .table { margin: 0; }
        .table thead { background: #f8f9fa; }
        .table th { font-weight: 600; color: #666; font-size: 13px; text-transform: uppercase; padding: 15px 20px; border: none; }
        .table td { padding: 15px 20px; border-color: #f0f0f0; vertical-align: middle; }
        .table tbody tr:hover { background: #f8f9fa; }
        .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 13px; margin: 0 3px; }
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 50px; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Heroes Management</h4>
        </div>

        <div class="data-table">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Owner</th>
                            <th>Level</th>
                            <th>Class</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="heroesTable">
                        <tr><td colspan="6" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        console.log('=== Heroes Management ===');
        
        const api = {
            baseUrl: '/api/admin',
            token: 'textical-admin-2024',
            
            async request(endpoint, options = {}) {
                const headers = {
                    'Content-Type': 'application/json',
                    'x-admin-token': this.token
                };

                try {
                    const response = await fetch(`${this.baseUrl}${endpoint}`, {
                        ...options,
                        headers: { ...headers, ...options.headers }
                    });

                    const data = await response.json();

                    if (!data.success) {
                        throw new Error(data.error || 'Request failed');
                    }

                    return data.data;
                } catch (error) {
                    console.error('API Request Error:', error);
                    throw error;
                }
            },

            getHeroes(page = 1, search = '') {
                const url = `/heroes?page=${page}&limit=50&search=${encodeURIComponent(search)}`;
                return this.request(url);
            }
        };

        async function loadHeroes() {
            try {
                console.log('[Heroes] Loading heroes...');
                
                const response = await api.getHeroes(1, '');
                console.log('[Heroes] API Response:', response);
                
                const tbody = document.getElementById('heroesTable');
                
                if (!response.heroes || response.heroes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No heroes found</td></tr>';
                } else {
                    tbody.innerHTML = response.heroes.map(hero => `
                        <tr>
                            <td>${hero.id}</td>
                            <td><strong>${hero.name}</strong></td>
                            <td>${hero.user ? hero.user.username : '<em>Unowned</em>'}</td>
                            <td>${hero.unitLevel}</td>
                            <td>${hero.combatClass ? hero.combatClass.name : 'None'}</td>
                            <td><button class="btn btn-sm btn-outline-primary btn-action" onclick="viewHero(${hero.id})"><i class="bi bi-eye"></i></button></td>
                        </tr>
                    `).join('');
                }
                
            } catch (error) {
                console.error('[Heroes] Error:', error);
                const tbody = document.getElementById('heroesTable');
                tbody.innerHTML = `
                    <tr><td colspan="6" class="text-center text-danger py-4">
                        <strong>Error:</strong><br>${error.message}
                    </td></tr>
                `;
            }
        }

        async function viewHero(id) {
            alert('Viewing hero: ' + id);
        }

        window.addEventListener('load', () => {
            console.log('[Heroes] Page load event');
            loadHeroes();
        });

        window.viewHero = viewHero;
    </script>
</body>
</html>

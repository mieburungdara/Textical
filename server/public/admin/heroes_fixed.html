<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes Management - Fixed</title>
    <style>
        .data-table { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05); }
        .table { margin: 0; }
        .table thead { background: #f8f9fa; }
        .table th { font-weight: 600; color: #666; font-size: 13px; text-transform: uppercase; padding: 15px 20px; border: none; }
        .table td { padding: 15px 20px; border-color: #f0f0f0; vertical-align: middle; }
        .table tbody tr:hover { background: #f8f9fa; }
        .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 13px; margin: 0 3px; }
        .search-box { position: relative; }
        .search-box input { padding-left: 45px; border-radius: 10px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 50px; }
    </style>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Heroes Management</h4>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" class="form-control" id="heroSearch" placeholder="Search by hero name..." oninput="handleHeroSearch()">
                </div>
            </div>
        </div>

        <div class="data-table">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Owner</th>
                            <th>Level</th>
                            <th>Class</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="heroesTable">
                        <tr><td colspan="6" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center p-3 border-top">
                <small class="text-muted" id="heroesPaginationInfo">Showing 0 to 0 of 0</small>
                <nav><ul class="pagination mb-0" id="heroesPagination"></ul></nav>
            </div>
        </div>

        <div class="modal fade" id="heroModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header"><h5 class="modal-title">Hero Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body" id="heroModalBody">Loading...</div>
                    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let heroesState = { data: [], page: 1, total: 0 };

        // Simple test function to run from console
        window.testHeroApi = async function() {
            try {
                console.log('=== Testing API ===');
                const response = await api.getHeroes(1, '');
                console.log('API Response:', response);
                return response;
            } catch (error) {
                console.error('API Test Error:', error);
                throw error;
            }
        };

        // Load heroes
        async function loadHeroes() {
            try {
                console.log('loadHeroes called with page:', heroesState.page);
                
                // Always use empty search initially to get all heroes
                const response = await api.getHeroes(heroesState.page, '');
                console.log('API returned:', JSON.stringify(response, null, 2));
                
                if (!response.heroes) {
                    throw new Error('API response missing heroes property');
                }
                
                heroesState.data = response.heroes;
                heroesState.total = response.pagination?.total || 0;
                
                const tbody = document.getElementById('heroesTable');
                if (!tbody) {
                    throw new Error('Table body not found');
                }
                
                if (response.heroes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No heroes found</td></tr>';
                } else {
                    tbody.innerHTML = response.heroes.map(hero => `
                        <tr>
                            <td>${hero.id}</td>
                            <td><strong>${hero.name}</strong></td>
                            <td>${hero.user ? hero.user.username : '<em>Unowned</em>'}</td>
                            <td>${hero.unitLevel}</td>
                            <td>${hero.combatClass ? hero.combatClass.name : 'None'}</td>
                            <td><button class="btn btn-sm btn-outline-primary btn-action" onclick="viewHero(${hero.id})"><i class="bi bi-eye"></i></button></td>
                        </tr>
                    `).join('');
                }
                
                updatePagination('heroes', response.pagination);
                
            } catch (error) {
                console.error('Load Heroes Error:', error);
                
                // Display error on page
                const tbody = document.getElementById('heroesTable');
                if (tbody) {
                    tbody.innerHTML = `
                        <tr><td colspan="6" class="text-center text-danger py-4">
                            <strong>Error loading heroes:</strong><br>
                            ${error.message}<br>
                            <small>See browser console for details</small>
                        </tr>
                    `;
                }
            }
        }

        // Search handler
        function handleHeroSearch() {
            clearTimeout(window.heroSearchTimeout);
            window.heroSearchTimeout = setTimeout(() => { 
                heroesState.page = 1; 
                loadHeroes(); 
            }, 300);
        }

        // View hero details
        async function viewHero(id) {
            try {
                const hero = heroesState.data.find(h => h.id === id);
                if (!hero) {
                    throw new Error('Hero not found');
                }
                
                const modalBody = document.getElementById('heroModalBody');
                modalBody.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Hero Information</h6>
                            <table class="table table-sm">
                                <tr><td><strong>ID:</strong></td><td>${hero.id}</td></tr>
                                <tr><td><strong>Name:</strong></td><td>${hero.name}</td></tr>
                                <tr><td><strong>Owner:</strong></td><td>${hero.user ? hero.user.username : 'Unowned'}</td></tr>
                                <tr><td><strong>Level:</strong></td><td>${hero.unitLevel}</td></tr>
                                <tr><td><strong>XP:</strong></td><td>${formatCurrency(hero.unitXp)}</td></tr>
                                <tr><td><strong>Class:</strong></td><td>${hero.combatClass ? hero.combatClass.name : 'None'}</td></tr>
                            </table>
                        </div>
                    </div>
                `;
                new bootstrap.Modal(document.getElementById('heroModal')).show();
                
            } catch (error) {
                console.error('View Hero Error:', error);
                showAlert('Failed to load hero details: ' + error.message, 'danger');
            }
        }

        // Pagination
        function changeHeroPage(page) {
            heroesState.page = page;
            loadHeroes();
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM content loaded');
            
            // Clear any invalid search input
            const searchInput = document.getElementById('heroSearch');
            if (searchInput) {
                if (searchInput.value.includes('http://') || searchInput.value.includes('localhost')) {
                    searchInput.value = '';
                }
            }
            
            loadHeroes();
        });

        // Export functions to global scope
        window.loadHeroes = loadHeroes;
        window.handleHeroSearch = handleHeroSearch;
        window.viewHero = viewHero;
        window.changeHeroPage = changeHeroPage;
    </script>
</body>
</html>

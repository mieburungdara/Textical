<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textical Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px;
            --header-height: 60px;
            --primary-color: #4f46e5;
        }
        body {
            background: #f1f5f9;
            min-height: 100vh;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
            padding-top: calc(var(--header-height) + 20px);
            min-height: 100vh;
        }
        #content-area {
            min-height: calc(100vh - var(--header-height) - 40px);
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }
        .page-loader {
            position: fixed;
            top: 0;
            left: var(--sidebar-width);
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 998;
        }
        .page-loader.active {
            display: flex;
        }
    </style>
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>
    
    <!-- Top Header -->
    <div id="headerContainer"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div id="content-area">
            <!-- Content will be loaded here -->
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footerContainer"></div>

    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script src="component-loader.js"></script>
    <script>
        console.log('[Admin] Script loaded, setting up...');
        
        // Debug: Check if Bootstrap is loaded
        console.log('[Admin] Bootstrap loaded:', typeof bootstrap !== 'undefined');
        
        // Function to attach click handlers to nav links
        function attachNavClickHandlers() {
            console.log('[Admin] Attaching nav click handlers...');
            const navLinks = document.querySelectorAll('.nav-link[data-page]');
            console.log(`[Admin] Found ${navLinks.length} nav links`);
            
            navLinks.forEach((link, index) => {
                console.log(`[Admin] Link ${index}: ${link.textContent.trim()} -> ${link.dataset.page}`);
                
                // Remove any existing onclick handlers
                link.onclick = null;
                
                // Add direct click handler
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('[Admin] Click detected on:', this.dataset.page);
                    
                    const page = this.dataset.page;
                    
                    // Update active state
                    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Store current page name
                    window.currentPageName = page.replace('.html', '');
                    
                    // Load the page
                    loadPage(page);
                });
            });
        }
        
        // Function to load a page
        function loadPage(page) {
            const loader = document.getElementById('pageLoader');
            const content = document.getElementById('content-area');
            
            if (!loader || !content) {
                console.error('[Admin] Loader or content area not found');
                return;
            }
            
            console.log(`[Admin] Loading page: ${page}`);
            loader.classList.add('active');
            
            fetch(page)
                .then(response => {
                    if (!response.ok) throw new Error(`Page not found: ${page} (${response.status})`);
                    return response.text();
                })
                .then(html => {
                    // Extract title from page content FIRST
                    const titleMatch = html.match(/<title>(.*?)<\/title>/);
                    if (titleMatch) {
                        const pageTitleEl = document.getElementById('pageTitle');
                        if (pageTitleEl) {
                            pageTitleEl.textContent = titleMatch[1];
                        }
                    }
                    
                    // Extract style tags from head section to preserve them
                    const styleRegex = /<style[\s\S]*?<\/style>/gi;
                    let styles = html.match(styleRegex) || [];
                    
                    // Remove DOCTYPE, html, head, body tags
                    let cleanHtml = html
                        .replace(/<!DOCTYPE[^>]*>/gi, '')
                        .replace(/<head[\s\S]*?<\/head>/gi, '')  // Remove entire head section
                        .replace(/<\/?html[^>]*>/gi, '')
                        .replace(/<\/?body[^>]*>/gi, '');
                    
                    // Prepend extracted styles if any
                    if (styles.length > 0) {
                        cleanHtml = styles.join('\n') + '\n' + cleanHtml;
                    }
                    
                    // Extract and remove script tags to execute them later
                    const scriptRegex = /<script[\s\S]*?>(\s*[\s\S]*?)\s*<\/script>/gi;
                    const scripts = [];
                    cleanHtml = cleanHtml.replace(scriptRegex, (match, scriptContent) => {
                        scripts.push(scriptContent);
                        return '';
                    });
                    
                    // Set content
                    content.innerHTML = cleanHtml;
                    console.log(`[Admin] Page ${page} loaded successfully`);
                    
                    // Execute inline scripts
                    scripts.forEach((scriptContent, index) => {
                        if (scriptContent.trim()) {
                            try {
                                // Execute script in global scope using eval
                                // This properly hoists function declarations
                                window.eval(scriptContent);
                                console.log(`[Admin] Script ${index + 1} executed successfully`);
                            } catch (error) {
                                console.error(`[Admin] Error executing script ${index + 1}:`, error);
                            }
                        }
                    });
                    
                    loader.classList.remove('active');
                })
                .catch(error => {
                    console.error('[Admin] Error loading page:', error);
                    content.innerHTML = `
                        <div class="alert alert-danger">
                            <h4>Error</h4>
                            <p>Failed to load page: ${error.message}</p>
                            <button class="btn btn-primary" onclick="loadPage('dashboard.html')">Go to Dashboard</button>
                        </div>
                    `;
                    loader.classList.remove('active');
                });
        }
        
        function logout() {
            console.log('[Admin] Logging out...');
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            localStorage.removeItem('adminCredentials');
            window.location.href = 'login.html';
        }
        
        // Make functions available globally
        window.logout = logout;
        window.loadPage = loadPage;
        
        // Initialize app
        async function initApp() {
            console.log('[Admin] Initializing app...');
            
            // Load sidebar, header, footer
            await ComponentLoader.loadAll();
            console.log('[Admin] Components loaded, attaching handlers...');
            
            // Attach click handlers to nav links
            attachNavClickHandlers();
            
            // Set initial page
            window.currentPageName = 'dashboard';
            
            // Highlight initial active nav item
            const initialLink = document.querySelector('.nav-link[data-page="dashboard.html"]');
            if (initialLink) {
                initialLink.classList.add('active');
                console.log('[Admin] Set initial active link to dashboard');
            }
            
            // Load initial page
            loadPage('dashboard.html');
        }
        
        // Listen for components loaded event (in case loadAll was already called)
        window.addEventListener('componentsLoaded', function() {
            console.log('[Admin] ComponentsLoaded event received');
            attachNavClickHandlers();
        });
        
        // Start app
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textical Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo h1 {
            color: #1a1a2e;
            font-size: 28px;
            font-weight: bold;
        }
        .login-logo p {
            color: #666;
            font-size: 14px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
        }
        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: #1a1a2e;
            border: none;
        }
        .btn-primary:hover {
            background: #16213e;
        }
        .btn-quick {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        .btn-quick:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
            color: white;
        }
        .btn-dev {
            border-radius: 10px;
            padding: 8px;
            font-weight: 600;
            background: #27ae60;
            border: none;
            color: white;
            font-size: 12px;
        }
        .btn-dev:hover {
            background: #219a52;
            color: white;
        }
        .alert {
            border-radius: 10px;
        }
        .dev-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
        }
        .dev-section small {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <h1>⚔️ Textical</h1>
            <p>Admin Panel</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="alert alert-danger d-none" id="errorAlert"></div>
            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                Login
            </button>
        </form>

        <div class="dev-section">
            <p class="text-center mb-2"><small>Development Mode</small></p>
            <button type="button" class="btn btn-quick w-100" id="quickLoginBtn">
                ⚡ Quick Login (admin/admin123)
            </button>
            <div class="mt-2">
                <button type="button" class="btn btn-dev w-100" id="autoLoginBtn">
                    🔄 Auto Login (remember me)
                </button>
            </div>
            <p class="text-center mt-2"><small id="savedStatus"></small></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-fill credentials if saved
        const savedCredentials = localStorage.getItem('adminCredentials');
        if (savedCredentials) {
            try {
                const cred = JSON.parse(savedCredentials);
                document.getElementById('username').value = cred.username || 'admin';
                document.getElementById('password').value = cred.password || 'admin123';
                document.getElementById('savedStatus').textContent = '✓ Credentials auto-filled';
            } catch (e) {}
        }

        // Quick login function
        async function quickLogin() {
            const username = document.getElementById('username').value || 'admin';
            const password = document.getElementById('password').value || 'admin123';
            const errorAlert = document.getElementById('errorAlert');
            const loginBtn = document.getElementById('quickLoginBtn');
            
            errorAlert.classList.add('d-none');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/admin/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    window.location.href = '/admin/index.html';
                } else {
                    errorAlert.textContent = data.error || 'Login failed';
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                errorAlert.textContent = 'Connection error';
                errorAlert.classList.remove('d-none');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '⚡ Quick Login (admin/admin123)';
            }
        }

        // Auto login with saved credentials
        async function autoLogin() {
            const username = document.getElementById('username').value || 'admin';
            const password = document.getElementById('password').value || 'admin123';
            
            // Save credentials
            localStorage.setItem('adminCredentials', JSON.stringify({ username, password }));
            document.getElementById('savedStatus').textContent = '✓ Credentials saved!';
            
            // Trigger quick login
            await quickLogin();
        }

        // Event listeners
        document.getElementById('quickLoginBtn').addEventListener('click', quickLogin);
        document.getElementById('autoLoginBtn').addEventListener('click', autoLogin);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await quickLogin();
        });

        // Check if already logged in
        if (localStorage.getItem('adminToken')) {
            window.location.href = '/admin/index.html';
        }

        // Keyboard shortcut: Enter to quick login
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName !== 'INPUT') {
                quickLogin();
            }
        });
    </script>
</body>
</html>

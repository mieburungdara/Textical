<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Management | Textical Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --quest-rarity-common: #94a3b8;
            --quest-rarity-rare: #3b82f6;
            --quest-rarity-epic: #a855f7;
            --quest-rarity-legendary: #f59e0b;
        }

        body {
            background-color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }

        .admin-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar - Master (Categories) */
        .category-sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .category-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            background: #fff;
        }

        .category-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .category-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #64748b;
            border-left: 4px solid transparent;
        }

        .category-item:hover {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .category-item.active {
            background-color: #f1f5f9;
            color: #6366f1;
            border-left-color: #6366f1;
            font-weight: 600;
        }

        .category-count {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        /* Main Content - Detail (List) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f8fafc;
        }

        .content-header {
            padding: 1.5rem;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quest-grid {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .quest-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .quest-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #6366f1;
        }

        .quest-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .quest-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #6366f1;
            margin-bottom: 1rem;
        }

        .quest-title {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .quest-desc {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 1rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .quest-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #94a3b8;
            padding-top: 1rem;
            border-top: 1px solid #f1f5f9;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Modal Enhancements */
        .modal-xl { max-width: 1100px; }
        .stage-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
        }
        .stage-number {
            width: 24px;
            height: 24px;
            background: #6366f1;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <!-- Category sidebar (Master) -->
    <aside class="category-sidebar">
        <div class="category-header">
            <h5 class="mb-0 fw-bold">Quest Categories</h5>
        </div>
        <div class="category-list" id="categoryList">
            <!-- Categories will be loaded here -->
            <div class="category-item active" onclick="window.selectCategory('ALL')">
                <span>All Quests</span>
                <span class="category-count" id="totalQuestCount">0</span>
            </div>
        </div>
    </aside>

    <!-- Main quest list (Detail) -->
    <main class="main-content">
        <header class="content-header">
            <div class="d-flex align-items-center gap-3">
                <h4 class="mb-0 fw-bold" id="selectedCategoryName">All Quests</h4>
                <div class="input-group" style="width: 300px;">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0" id="questSearch" placeholder="Search quests..." oninput="window.handleQuestSearch()">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary d-flex align-items-center gap-2" onclick="window.loadQuests()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
                <button class="btn btn-primary d-flex align-items-center gap-2" onclick="window.createQuest()">
                    <i class="bi bi-plus-lg"></i> New Quest
                </button>
            </div>
        </header>

        <div class="quest-grid">
            <div class="row g-4" id="questList">
                <!-- Quests will be loaded here -->
            </div>
            
            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-white rounded-3 border">
                <small class="text-muted" id="questsPaginationInfo">Showing 0 to 0 of 0</small>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="questsPagination"></ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<!-- Quest Details Modal -->
<div class="modal fade" id="questModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold">Quest Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4" id="questModalBody">
                <!-- content as needed -->
            </div>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
    let currentCategory = 'ALL';
    let currentPage = 1;
    let questsData = [];
    let questSearchTimeout = null;

    async function init() {
        await loadCategories();
        await loadQuests();
    }

    async function loadCategories() {
        try {
            const categories = await api.getQuestCategories();
            const list = document.getElementById('categoryList');
            const total = categories.reduce((sum, c) => sum + c.count, 0);
            
            document.getElementById('totalQuestCount').textContent = total;
            
            let html = `
                <div class="category-item ${currentCategory === 'ALL' ? 'active' : ''}" onclick="window.selectCategory('ALL')">
                    <span>All Quests</span>
                    <span class="category-count">${total}</span>
                </div>
            `;
            
            categories.forEach(cat => {
                html += `
                    <div class="category-item ${currentCategory === cat.name ? 'active' : ''}" onclick="window.selectCategory('${cat.name}')">
                        <span>${cat.name || 'Uncategorized'}</span>
                        <span class="category-count">${cat.count}</span>
                    </div>
                `;
            });
            
            list.innerHTML = html;
        } catch (error) {
            console.error('Error loading categories:', error);
        }
    }

    async function loadQuests() {
        const container = document.getElementById('questList');
        container.innerHTML = '<div class="loading-spinner"><div class="spinner-border text-primary" role="status"></div></div>';
        
        try {
            const search = document.getElementById('questSearch').value;
            const response = await api.getQuests(currentPage, search, currentCategory);
            questsData = response.quests;
            
            if (questsData.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-journal-x display-1 text-muted opacity-25 mb-4"></i>
                        <h4 class="text-muted">No quests found in this category</h4>
                    </div>
                `;
            } else {
                let html = '';
                questsData.forEach(quest => {
                    const rarityClass = getRarityClass(quest.rarity || 'COMMON');
                    html += `
                        <div class="col-md-6 col-lg-4">
                            <article class="quest-card" onclick="window.viewQuest(${quest.id})">
                                <span class="quest-badge ${rarityClass}">${quest.rarity || 'COMMON'}</span>
                                <div class="quest-icon">
                                    <i class="bi bi-journal-text"></i>
                                </div>
                                <h3 class="quest-title">${quest.name}</h3>
                                <p class="quest-desc">${quest.description || 'No description available.'}</p>
                                <div class="quest-meta">
                                    <div class="meta-item">
                                        <i class="bi bi-person"></i>
                                        <span>${quest.questGiver?.name || 'Unknown'}</span>
                                    </div>
                                    <div class="meta-item">
                                        <i class="bi bi-layers"></i>
                                        <span>${quest.stages?.length || 0} Stages</span>
                                    </div>
                                </div>
                            </article>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
            
            updatePagination('quests', response.pagination);
        } catch (error) {
            console.error('Error loading quests:', error);
            container.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
        }
    }

    window.selectCategory = function(category) {
        currentCategory = category;
        currentPage = 1;
        document.getElementById('selectedCategoryName').textContent = category === 'ALL' ? 'All Quests' : category;
        loadCategories();
        loadQuests();
    };

    window.handleQuestSearch = function() {
        clearTimeout(questSearchTimeout);
        questSearchTimeout = setTimeout(() => {
            currentPage = 1;
            loadQuests();
        }, 300);
    };

    window.changePage = function(section, page) {
        currentPage = page;
        loadQuests();
    };

    window.viewQuest = function(id) {
        const quest = questsData.find(q => q.id === id);
        if (!quest) return;
        
        const modalBody = document.getElementById('questModalBody');
        modalBody.innerHTML = `
            <div class="row">
                <div class="col-md-4">
                    <div class="card border-0 bg-light mb-4">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">General Info</h6>
                            <table class="table table-sm table-borderless mb-0">
                                <tr><td class="text-muted">ID</td><td>${quest.id}</td></tr>
                                <tr><td class="text-muted">Rarity</td><td><span class="badge ${getRarityClass(quest.rarity)}">${quest.rarity}</span></td></tr>
                                <tr><td class="text-muted">Category</td><td>${quest.category || 'None'}</td></tr>
                                <tr><td class="text-muted">Requirement</td><td>Level ${quest.minLevel || 1}</td></tr>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <h5 class="fw-bold mb-2">${quest.name}</h5>
                    <p class="text-muted mb-4">${quest.description}</p>
                    
                    <h6 class="fw-bold mb-3">Quest Stages (${quest.stages?.length || 0})</h6>
                    <div class="quest-stages">
                        ${quest.stages.map((stage, idx) => `
                            <div class="stage-box">
                                <div class="d-flex align-items-center gap-3 mb-3">
                                    <div class="stage-number">${idx + 1}</div>
                                    <h6 class="mb-0 fw-bold">${stage.name || 'Stage ' + (idx + 1)}</h6>
                                </div>
                                <p class="small text-muted mb-3">${stage.description || ''}</p>
                                
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="p-2 bg-white rounded border small">
                                            <div class="fw-bold mb-1"><i class="bi bi-bullseye me-2"></i>Objectives</div>
                                            <ul class="list-unstyled mb-0">
                                                ${stage.objectives.map(obj => `
                                                    <li>• ${obj.description} <small class="text-muted">(${obj.type})</small></li>
                                                `).join('')}
                                            </ul>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="p-2 bg-white rounded border small">
                                            <div class="fw-bold mb-1"><i class="bi bi-gift me-2"></i>Rewards</div>
                                            <ul class="list-unstyled mb-0 text-success">
                                                ${stage.rewards.map(rew => `
                                                    <li>• ${rew.amount} ${rew.type}</li>
                                                `).join('') || '<li>None</li>'}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
        
        new bootstrap.Modal(document.getElementById('questModal')).show();
    };

    window.createQuest = function() {
        showAlert('Create Quest feature coming soon!', 'info');
    };

    // Initialize
    init();
</script>
</body>
</html>

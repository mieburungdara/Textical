<title>Quests Management</title>
<style>.data-table{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 15px rgba(0,0,0,0.05)}.table{margin:0}.table thead{background:#f8f9fa}.table th{font-weight:600;color:#666;font-size:13px;text-transform:uppercase;padding:15px 20px;border:none}.table td{padding:15px 20px;border-color:#f0f0f0;vertical-align:middle}.btn-action{padding:6px 12px;border-radius:6px;font-size:13px;margin:0 3px}.search-box{position:relative}.search-box input{padding-left:45px;border-radius:10px}.search-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666}.loading-spinner{display:flex;justify-content:center;align-items:center;padding:50px}</style>
<div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">Quests Management</h4></div>
<div class="row g-3 mb-4"><div class="col-md-6"><div class="search-box"><i class="bi bi-search"></i><input type="text" class="form-control" id="questSearch" placeholder="Search by quest name..." oninput="window.handleQuestSearch()"></div></div></div>
<div class="data-table"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead><tbody id="questsTable"><tr><td colspan="4" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center p-3 border-top"><small class="text-muted" id="questsPaginationInfo">Showing 0 to 0 of 0</small><nav><ul class="pagination mb-0" id="questsPagination"></ul></nav></div></div>
<div class="modal fade" id="questModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Quest Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="questModalBody">Loading...</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
<script src="common.js"></script>
<script>let questsState={data:[],page:1,total:0};window.loadQuests=async function(){try{console.log('[Quests] Loading quests...');const data=await api.getQuests(questsState.page,document.getElementById('questSearch')?.value||'');questsState.data=data.quests;questsState.total=data.pagination.total;const tbody=document.getElementById('questsTable');if(data.quests.length===0){tbody.innerHTML='<tr><td colspan="4" class="text-center text-muted py-4">No quests found</td></tr>'}else{tbody.innerHTML=data.quests.map(q=>`<tr><td>${q.id}</td><td><strong>${q.name}</strong></td><td>${truncateText(q.description,80)}</td><td><button class="btn btn-sm btn-outline-primary btn-action" onclick="window.viewQuest(${q.id})"><i class="bi bi-eye"></i></button></td></tr>`).join('')}updatePagination('quests',data.pagination);console.log('[Quests] Quests loaded successfully')}catch(error){console.error('[Quests] Error loading quests:',error);document.getElementById('questsTable').innerHTML=`<tr><td colspan="4" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;showAlert('Failed to load quests','danger')}};window.handleQuestSearch=function(){clearTimeout(window.questSearchTimeout);window.questSearchTimeout=setTimeout(()=>{questsState.page=1;window.loadQuests()},300)};window.viewQuest=function(id){try{console.log('[Quests] Viewing quest:',id);const quest=questsState.data.find(q=>q.id===id);document.getElementById('questModalBody').innerHTML=`<h6>Quest Information</h6><table class="table table-sm"><tr><td><strong>ID:</strong></td><td>${quest.id}</td></tr><tr><td><strong>Name:</strong></td><td>${quest.name}</td></tr><tr><td><strong>Description:</strong></td><td>${quest.description||'None'}</td></tr></table>`;new bootstrap.Modal(document.getElementById('questModal')).show()}catch(error){console.error('[Quests] Error viewing quest:',error);showAlert('Failed to load quest details','danger')}};window.changeQuestPage=function(page){questsState.page=page;window.loadQuests()};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',window.loadQuests)}else{window.loadQuests()}</script>

<title>Skills Management</title>
<style>.data-table{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 15px rgba(0,0,0,0.05)}.table{margin:0}.table thead{background:#f8f9fa}.table th{font-weight:600;color:#666;font-size:13px;text-transform:uppercase;padding:15px 20px;border:none}.table td{padding:15px 20px;border-color:#f0f0f0;vertical-align:middle}.btn-action{padding:6px 12px;border-radius:6px;font-size:13px;margin:0 3px}.search-box{position:relative}.search-box input{padding-left:45px;border-radius:10px}.search-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666}.loading-spinner{display:flex;justify-content:center;align-items:center;padding:50px}</style>
<div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">Skills Management</h4></div>
<div class="row g-3 mb-4"><div class="col-md-6"><div class="search-box"><i class="bi bi-search"></i><input type="text" class="form-control" id="skillSearch" placeholder="Search by skill name..." oninput="window.handleSkillSearch()"></div></div></div>
<div class="data-table"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead><tbody id="skillsTable"><tr><td colspan="4" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center p-3 border-top"><small class="text-muted" id="skillsPaginationInfo">Showing 0 to 0 of 0</small><nav><ul class="pagination mb-0" id="skillsPagination"></ul></nav></div></div>
<div class="modal fade" id="skillModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Skill Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="skillModalBody">Loading...</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
<script src="common.js"></script>
<script>let skillsState={data:[],page:1,total:0};window.loadSkills=async function(){try{console.log('[Skills] Loading skills...');const data=await api.getSkills(skillsState.page,document.getElementById('skillSearch')?.value||'');skillsState.data=data.skills;skillsState.total=data.pagination.total;const tbody=document.getElementById('skillsTable');if(data.skills.length===0){tbody.innerHTML='<tr><td colspan="4" class="text-center text-muted py-4">No skills found</td></tr>'}else{tbody.innerHTML=data.skills.map(s=>`<tr><td>${s.id}</td><td><strong>${s.name}</strong></td><td>${truncateText(s.description,80)}</td><td><button class="btn btn-sm btn-outline-primary btn-action" onclick="window.viewSkill(${s.id})"><i class="bi bi-eye"></i></button></td></tr>`).join('')}updatePagination('skills',data.pagination);console.log('[Skills] Skills loaded successfully')}catch(error){console.error('[Skills] Error loading skills:',error);document.getElementById('skillsTable').innerHTML=`<tr><td colspan="4" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;showAlert('Failed to load skills','danger')}};window.handleSkillSearch=function(){clearTimeout(window.skillSearchTimeout);window.skillSearchTimeout=setTimeout(()=>{skillsState.page=1;window.loadSkills()},300)};window.viewSkill=function(id){try{console.log('[Skills] Viewing skill:',id);const skill=skillsState.data.find(s=>s.id===id);document.getElementById('skillModalBody').innerHTML=`<h6>Skill Information</h6><table class="table table-sm"><tr><td><strong>ID:</strong></td><td>${skill.id}</td></tr><tr><td><strong>Name:</strong></td><td>${skill.name}</td></tr><tr><td><strong>Description:</strong></td><td>${skill.description||'None'}</td></tr></table>`;new bootstrap.Modal(document.getElementById('skillModal')).show()}catch(error){console.error('[Skills] Error viewing skill:',error);showAlert('Failed to load skill details','danger')}};window.changeSkillPage=function(page){skillsState.page=page;window.loadSkills()};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',window.loadSkills)}else{window.loadSkills()}</script>

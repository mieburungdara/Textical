<title>Traits Management</title>
<style>.data-table{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 15px rgba(0,0,0,0.05)}.table{margin:0}.table thead{background:#f8f9fa}.table th{font-weight:600;color:#666;font-size:13px;text-transform:uppercase;padding:15px 20px;border:none}.table td{padding:15px 20px;border-color:#f0f0f0;vertical-align:middle}.btn-action{padding:6px 12px;border-radius:6px;font-size:13px;margin:0 3px}.search-box{position:relative}.search-box input{padding-left:45px;border-radius:10px}.search-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666}.loading-spinner{display:flex;justify-content:center;align-items:center;padding:50px}</style>
<div class="d-flex justify-content-between align-items-center mb-4"><h4 class="mb-0">Traits Management</h4></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="search-box"><i class="bi bi-search"></i><input type="text" class="form-control" id="traitSearch" placeholder="Search by trait name..." oninput="window.handleTraitSearch()"></div></div><div class="col-md-2"><select class="form-select" id="traitCategoryFilter" onchange="window.handleTraitFilter()"><option value="">All Categories</option><option value="COMBAT">Combat</option><option value="GENERAL">General</option><option value="GENETIC">Genetic</option></select></div></div>
<div class="data-table"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Description</th><th>Actions</th></tr></thead><tbody id="traitsTable"><tr><td colspan="5" class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center p-3 border-top"><small class="text-muted" id="traitsPaginationInfo">Showing 0 to 0 of 0</small><nav><ul class="pagination mb-0" id="traitsPagination"></ul></nav></div></div>
<div class="modal fade" id="traitModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Trait Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="traitModalBody">Loading...</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
<script src="common.js"></script>
<script>let traitsState={data:[],page:1,total:0};window.loadTraits=async function(){try{console.log('[Traits] Loading traits...');const data=await api.getTraits(traitsState.page,document.getElementById('traitSearch')?.value||'',document.getElementById('traitCategoryFilter')?.value||'');traitsState.data=data.traits;traitsState.total=data.pagination.total;const tbody=document.getElementById('traitsTable');if(data.traits.length===0){tbody.innerHTML='<tr><td colspan="5" class="text-center text-muted py-4">No traits found</td></tr>'}else{tbody.innerHTML=data.traits.map(t=>`<tr><td>${t.id}</td><td><strong>${t.name}</strong></td><td><span class="badge ${getTraitCategoryClass(t.category)}">${t.category}</span></td><td>${truncateText(t.description,60)}</td><td><button class="btn btn-sm btn-outline-primary btn-action" onclick="window.viewTrait(${t.id})"><i class="bi bi-eye"></i></button></td></tr>`).join('')}updatePagination('traits',data.pagination);console.log('[Traits] Traits loaded successfully')}catch(error){console.error('[Traits] Error loading traits:',error);document.getElementById('traitsTable').innerHTML=`<tr><td colspan="5" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;showAlert('Failed to load traits','danger')}};window.handleTraitSearch=function(){clearTimeout(window.traitSearchTimeout);window.traitSearchTimeout=setTimeout(()=>{traitsState.page=1;window.loadTraits()},300)};window.handleTraitFilter=function(){traitsState.page=1;window.loadTraits()};window.viewTrait=function(id){try{console.log('[Traits] Viewing trait:',id);const trait=traitsState.data.find(t=>t.id===id);document.getElementById('traitModalBody').innerHTML=`<h6>Trait Information</h6><table class="table table-sm"><tr><td><strong>ID:</strong></td><td>${trait.id}</td></tr><tr><td><strong>Name:</strong></td><td>${trait.name}</td></tr><tr><td><strong>Category:</strong></td><td><span class="badge ${getTraitCategoryClass(trait.category)}">${trait.category}</span></td></tr><tr><td><strong>Description:</strong></td><td>${trait.description||'None'}</td></tr></table>`;new bootstrap.Modal(document.getElementById('traitModal')).show()}catch(error){console.error('[Traits] Error viewing trait:',error);showAlert('Failed to load trait details','danger')}};window.changeTraitPage=function(page){traitsState.page=page;window.loadTraits()};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',window.loadTraits)}else{window.loadTraits()}</script>

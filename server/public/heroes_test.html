<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { background-color: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background-color: #ffebee; color: #c62828; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Heroes API Test</h1>
        <button onclick="testApi()">Test API</button>
        <div id="results"></div>
    </div>

    <script>
        const api = {
            baseUrl: '/api/admin',
            token: 'textical-admin-2024',
            
            async request(endpoint, options = {}) {
                const headers = {
                    'Content-Type': 'application/json',
                    'x-admin-token': this.token
                };

                const response = await fetch(`${this.baseUrl}${endpoint}`, {
                    ...options,
                    headers: { ...headers, ...options.headers }
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Request failed');
                }

                return data.data;
            },

            getHeroes(page = 1, search = '') {
                console.log('[Common] getHeroes called with page:', page, 'search:', search);
                const url = `/heroes?page=${page}&limit=50&search=${encodeURIComponent(search)}`;
                console.log('[Common] API URL:', this.baseUrl + url);
                return this.request(url).then(data => {
                    console.log('[Common] API Response received:', data);
                    return data;
                }).catch(error => {
                    console.error('[Common] API Error:', error);
                    throw error;
                });
            }
        };

        async function testApi() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            try {
                resultsDiv.innerHTML += '<div class="result">Testing API...</div>';
                
                // Test api.getHeroes directly
                const response = await api.getHeroes(1, '');
                resultsDiv.innerHTML += `<div class="result"><strong>api.getHeroes response:</strong><br><pre>${JSON.stringify(response, null, 2)}</pre></div>`;
                
                // Check heroes property
                if (!response.heroes) {
                    resultsDiv.innerHTML += '<div class="result error">Error: Response does not contain heroes property</div>';
                    console.error('Response structure:', response);
                } else {
                    resultsDiv.innerHTML += `<div class="result">Heroes found: ${response.heroes.length}</div>`;
                }
                
            } catch (error) {
                resultsDiv.innerHTML += `<div class="result error">Error: ${error.message}</div>`;
                console.error('Error details:', error);
            }
        }

        // Auto-run test
        testApi();
    </script>
</body>
</html>
